name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpu:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-cpu
            os: ubuntu-latest
          - name: macos-arm64-cpu
            os: macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.7" # keep equal to the uv version that produced uv.lock
          enable-cache: true

      - name: Install the pinned Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          cargo --version
          cargo fmt --version
          cargo clippy --version

      - uses: Swatinem/rust-cache@v2.9.3

      - name: uv sync (installs the managed CPython 3.12 from .python-version)
        run: uv sync --locked --extra dev

      - name: maturin develop (builds hsn_rs into .venv)
        run: uv run maturin develop --uv -m rust/hsn-py/Cargo.toml

      - name: pytest
        run: uv run pytest -q

      - name: cargo test
        run: cargo test --workspace

      - name: build_kernels --target none
        run: uv run python scripts/build_kernels.py --target none

      - name: build_kernels --target all (hosted runners print "no toolchain")
        run: uv run python scripts/build_kernels.py --target all --out build

      - name: pre-commit
        run: uv run pre-commit run --all-files --show-diff-on-failure
