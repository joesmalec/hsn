# HSN experiment configuration: every key of Appendix A with its default (P0.2).
#
# Copy this file, change what the experiment needs and pass it to `hsn run --config <file>`. Dotted
# command-line overrides (`model.k_select=4`) take precedence over the file. Defaults are the Appendix C
# reference configuration (1,820,361 parameters). Derived quantities (parameter counts, measured memory,
# tokens/s) never live here: the run manifest records what was measured. Thresholds are not config
# either: they are frozen in configs/metrics_freeze.json (P0.8).

run_id: example
seed: 0
notes: "Appendix A example: every key at its default."
profile: cpu # hardware profile: configs/hardware/<profile>.yaml (Appendix A.5) unless `hardware:` is inline
model_name: hsn # hsn | gru | transformer | selective_ssm | moe

model: # Appendix A.1
  vocab_size: 256 # byte vocabulary V
  d: 64 # width
  n_cells: 32 # N
  n_units: 8 # M
  k_select: 4 # K cells per round; must be <= n_cells
  k_min: 1 # minimum selected cells
  r_max: 1 # internal rounds cap (1-3)
  in_degree: 4 # D_g; 0 disables propagation (ablation); must be < n_cells
  random_edges: 0 # extra random candidate edges
  edge_norm: softmax # softmax | sigmoid
  hidden: 512 # H for every two-layer MLP
  n_context: 16 # context symbols
  context_dim: 64 # context embedding width (= d)
  activation: gelu # MLP activation (paper unspecified)
  init: trunc_normal_0.02 # weight init of embeddings, scorer, halting, decoder (paper unspecified)
  state_init: fan_in # P1.5a (amendment A1): E, P, S, units, V, W_out, gate weight; fan_in | trunc_normal_<std>
  cell_norm: rms # P1.5a: RMSNorm over the 4d cell input before the units and the gate; rms | none
  gate_bias_init: -3.0 # P1.5a: gate bias at init, sigmoid(-3) = 0.047 (cells retain by default)
  cand_norm: none # P1.13: RMSNorm (learned gain, width d) on W_out(.) before the candidate's tanh; none | rms
  scorer: linear # linear | mlp
  scorer_hidden: 128 # hidden width when scorer = mlp
  scorer_features:
    exclude: [] # feature names to zero (ablation; e.g. [eps])
  routing: dense # dense | topk | greedy_budget | random | fixed
  key_address: false # A5 fixed byte/cell address features; routed HSN only
  selected_readout: false # A5 selected-cell mean appended to decoder input; routed HSN only
  decoder_shortcut_dropout: 0.0 # training-only joint q/u dropout; requires selected_readout
  fixed_route: [] # cells for routing = fixed
  budget: 1.0 # B_t as a fraction of the dense step cost
  lambda_cost: 0.0 # lambda_cost in score = U - lambda * c
  deadline_ms: null # wall-clock deadline (serving)
  cost_profile: null # P2.1: cost profile (P0.6 report + cost_profile block) for the router's cost table; null = uniform placeholder
  static_k: true # pad selection to fixed K (needed for graphs / compile)
  age_max: 64 # refresh-probe threshold
  halt_threshold: 0.5 # inference halting threshold
  predictor_target: fixed_embedding # fixed_embedding | ema_encoder (P1.6)
  disabled_cells: [] # test hook
  ablate_shared_u: false # ablation: remove u from v
  state_schema_version: 1 # bumped on any state layout change

data: # Appendix A.2
  dataset: synthetic_v1
  manifest: null # split manifest with hashes (P0.4 / P4.1)
  tokenizer: bytes # only byte-level in this program
  tasks: [] # task names or stage ids
  variants: [] # P0.8: in_range | out_of_range variants of the tasks to load; [] = every variant
  context_symbols: configs/data/context_symbols.yaml # id table
  split: train # train | dev | test (test only in gate scripts)
  align_docs: true # P0.5: every document starts at a window boundary (in_range = fits one window)

train: # Appendix A.3
  optimizer: adamw # adamw | lazy_adamw (P2.6); unset = adamw if routing is dense, else lazy_adamw
  lr: 0.001
  betas: [0.9, 0.999]
  weight_decay: 0.01
  warmup_steps: 0
  schedule: constant # constant | cosine | linear | wsd (P1.13: warmup-stable-decay)
  decay_fraction: null # P1.13: wsd only (required there): decay (1 - sqrt, to 0) over this fraction of steps
  cell_lr_mult: 1.0 # P1.13: the HSN cell's parameter group trains at lr * cell_lr_mult
  router_lr_mult: 1.0 # A5 stability: HSN.router rate (learned routing only)
  readout_lr_mult: 1.0 # A5 stability: whole HSN.decoder rate, including shared columns
  update_limit: # project excessive optimizer displacements; no finite batch is discarded
    norm_growth_limits: {} # optional group -> ceiling as a multiple of its initial norm (>=1)
    groups: {} # name -> {selectors: [parameter-name globs], max_ratio: relative L2 cap}
    norm_floor: 1.0e-12 # denominator floor for groups with zero/small weight norm
  gradient_growth: # reversible damping of selected groups when raw gradient medians rise
    enabled: false # requires groups; adaptive_lr, rollback and spike skipping must be off
    groups: {} # arbitrary group name -> list of parameter-name globs
    window: 100 # recent/reference median widths in finite accepted samples
    reference_lag: 500 # distance between windows; at least window
    interval: 100 # sample cadence of decisions
    growth_threshold: 1.5 # minimum group norm growth before damping
    global_growth_threshold: 1.25 # global norm growth required to call a group hot
    min_share: 0.25 # minimum group share of the pre-clip gradient norm
    share_power: 1.0 # rising share strengthens the response (zero ignores share growth)
    response_power: 1.0 # exponent of the inverse excess-growth response
    recovery_threshold: 1.1 # group growth at/below this permits recovery toward scale 1
    recovery_rate: 0.1 # maximum scale increase at one observation
    min_scale: 0.25 # floor for each selected group; other parameters are unchanged
    norm_floor: 1.0e-12 # protects ratios with zero/near-zero reference norms
  adaptive_lr: # opt-in training-only feedback; scales multiply the chosen schedule
    enabled: false
    interval: 100 # accepted updates per fixed training-monitor measurement
    monitor_docs: 32 # increased automatically to cover every task/variant
    patience: 2
    cooldown: 2 # monitor windows after a rate change
    threshold: 0.01 # relative monitor-loss change
    reduce_factor: 0.5
    increase_factor: 1.1 # bounded plateau trial; only kept if loss improves
    min_scale: 0.03125
    max_scale: 1.0 # default trials can recover cuts but cannot exceed the initial rate
    grad_growth: 3.0
    max_update_ratio: 0.01 # sampled ||weight change|| / ||weight after update||
    router_max_update_ratio: 0.005
    readout_max_update_ratio: 0.005
    trial_windows: 2
    loss_cuts: true # false ablates cuts from sustained loss regression alone
    gradient_cuts: true # false ablates the joint loss/gradient warning and its trial veto
    update_cuts: true # false ablates per-component update cuts and their trial veto
    trial_increases: true # false disables upward trials; emergency guard cuts are always active
  cell_weight_decay: null # P1.13: weight decay of the cell's tensors with ndim >= 2; null = weight_decay
  spike_factor: null # P1.15: skip a step whose grad norm > factor x the running median (null: off; 1e3-1e4)
  spike_window: 100 # P1.15: applied steps in that median (read only with spike_factor set)
  slow_burst_factor: null # optional sustained rise of the median; requires spike_factor
  slow_burst_window: 250 # applied steps between median windows; requires slow_burst_factor
  divergence_dump: true # P1.15: dump the pre-step state at the first skipped step (replay it)
  divergence_max_dumps: 1 # bounded event capture; set 5 for a spike investigation
  divergence_healthy_every: 0 # optional pre-update healthy reference cadence; 0 disables it
  divergence_healthy_keep: 2 # rolling references frozen alongside each captured event
  rollback_every: null # P1.16: snapshot cadence of the rollback on a guard trigger (null: off; 50)
  rollback_skip: 0 # P1.16: extra steps' worth of windows discarded after a rollback (10)
  rollback_lr_mult: 1.0 # P1.16: learning-rate factor after a rollback, in (0, 1] (0.5)
  rollback_lr_steps: 0 # P1.16: steps the factor lasts (200)
  rollback_max: 5 # P1.16: the run stops at its rollback_max + 1-th trigger
  rollback_selection: oldest # oldest | guard_horizon (newest before the guard reference horizon)
  unroll: 256 # TBPTT window
  batch: 4
  micro_batch: 4
  grad_accum: 1
  precision: bf16 # bf16 | fp16 | fp32 | fp64 (fp64 only for gradcheck)
  grad_clip: 1.0 # global norm clip
  grad_norm_precision: native # native | float64; wide global reduction and clipping, opt-in
  steps: 1000
  eval_every: 100
  ckpt_every: 500
  stats_every: 50
  q_resync_every: 64 # windows between exact q recomputation
  lambda_p: 1.0 # L_pred is part of the base objective (§2.6)
  lambda_r: 0.0 # replay
  lambda_d: 0.0 # distillation
  lambda_e: 0.0 # EWC
  lambda_c: 0.0 # cost
  lambda_b: 0.0 # balance
  lambda_g: 0.0 # graph
  lambda_u: 0.0 # utility target
  lambda_ponder: 0.0 # halting
  aux_enabled: [] # which of cost / balance / graph are on (<= 1 unless justified)
  allow_multiple_aux: "" # written justification enabling more than one auxiliary term
  gate_mode: soft # soft | ste | reinforce (P2.2): the estimator after the soft warm-up
  soft_until_step: 0 # steps trained with soft gates before gate_mode takes over
  temperature_start: 1.0 # tau of the soft mask / unit softmax: linear ramp over temperature_steps
  temperature_end: 1.0 # must equal temperature_start when temperature_steps = 0
  temperature_steps: 0
  epsilon_start: 0.0 # exploration: one selected cell replaced by a random one with probability eps
  epsilon_end: 0.0 # must equal epsilon_start when epsilon_steps = 0
  epsilon_steps: 0
  p_dense: 0.0 # probability that a sample runs the dense step (charged to Selection.cost)
  reinforce_baseline_decay: 0.9 # P2.2: EMA rate of the REINFORCE reward baseline (gate_mode = reinforce)
  probe_fraction: 0.05 # P2.3
  n_probe: 4
  probe_horizon: 16 # null probes to the window end; integers preserve fixed-horizon behavior
  ema_decay: 0.99
  replay_fraction: 0.25 # rows per window from replay
  distill_temperature: 2.0 # P3.2
  obsolete_label_versions: []
  ewc_cap: 1.0 # P3.3
  ewc_batches: 64
  ewc_groups: {} # group name -> parameter-name prefixes (shared | units | router | edges)
  pcgrad: false # P3.6
  pcgrad_eps: 1.0e-8
  interference_window: 32
  shared_lr_scale_on_conflict: 0.5
  activation_checkpoint: none # none | per_round | per_window (P4.3)
  deterministic: false # deterministic kernels and backward
  search_trials: 1 # P0.5: hyperparameter-search trials every method gets (equal budgets, §12)
  ema_tau: 0.99 # P1.6: EMA rate of the target encoder when model.predictor_target = ema_encoder
  variance_floor_gamma: 1.0 # P1.6: per-dimension std floor on the batch of z (EMA mode); 0 disables

replay: # Appendix A.4 (P3.1)
  path: null
  capacity: 100000
  quotas: {} # stratum -> minimum records
  near_dup_threshold: 0.9
  expiry_days: null

fast: # Appendix A.4 (P3.4)
  rank: 8
  rho: 1.0 # norm bound of the residual
  eta: 0.01 # local learning rate
  steps_max: 10
  retention_max_loss_pp: 1.0

growth: # Appendix A.4 (P3.5 / P4.2)
  threshold_per_task: {} # task -> accuracy threshold
  windows: 3
  cap: 0.25
  budget_per_stage: {} # stage -> step budget
  quality_tolerance_pp: 1.0
  starting_params: null # set by the controller from the measured count at stage start

san: # Appendix A.4 (P4.6)
  update_every_windows: 16
  validation_windows: 4
  max_edges: 128 # n_cells * in_degree for the reference configuration
  k_random: 4
  quality_tolerance_pp: 1.0

stream: # Appendix A.4 (P4.4); the hardware profile may override these keys
  enabled: false
  device_budget_bytes: 0
  host_budget_bytes: 0
  policy: utility_lru # lru | utility_lru | pinned
  hot_windows: 4
  prefetch_top: 2K # integer or "<n>K" (a multiple of k_select)

serve: # Appendix A.4 (P5.3 / P5.4)
  persistence_enabled: false
  state_ttl_s: 3600
  encryption: none # none | aes_gcm
  limits:
    max_input_bytes: 65536
    max_tokens: 4096
    max_budget: 1.0
    max_deadline_ms: 1000.0
    rps_per_tenant: 10.0
  capture_policy: disabled # disabled | local_only | shared_candidates

baseline: # P0.5 baseline sizes (not in Appendix A); model_name selects which baseline runs
  gru: # 1,977,856 parameters measured for V=256, 16 context symbols
    d_model: 384 # embedding and hidden width
    n_layers: 2 # stacked GRU layers
    dropout: 0.0 # on embeddings, between layers, on the output
  transformer: # 1,930,624 parameters measured for V=256, 16 context symbols, unroll 256
    d_model: 192 # width; a multiple of n_heads
    n_layers: 4 # pre-norm blocks
    n_heads: 4 # attention heads
    ffn_hidden: 768 # MLP hidden width (4 x d_model)
    dropout: 0.0 # embeddings, attention, residual branches
