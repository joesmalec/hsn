# profile:dgx_spark -- NVIDIA DGX Spark, GB10 Grace Blackwell (aarch64 CPU + Blackwell GPU, compute
# capability 12.1), CUDA 13.0.2 on DGX OS 7.4.0, driver 580.126.09 (Plan §3.1, §3.3). Large
# configurations, aarch64 CUDA builds, nightly perf. Appendix A.5 fields; values from Appendix E.1,
# §3.4, §3.7 and §3.8.
name: dgx_spark
device: cuda
autocast_dtype: bf16
master_dtype: fp32
vram_bytes: 137438953472 # 128 GiB unified, shared with the Grace CPU; the byte budget is still enforced
vram_cap_fraction: 1.0
unified_memory: true
pinned_memory: false # unified memory: no host->device copy (Appendix E.1)
compile_mode: none
nvcc_arch: [sm_121] # sm_120 cubins also load by the minor-revision rule; sm_121 is built for exactness (§3.4)
power_meter: nvml # §3.8: nvidia-smi/NVML gives GPU-only power on the Spark; whole-system needs a wall meter
recipe:
  batch: 4
  micro_batch: 4
  unroll: 256
  activation_checkpoint: none
stream: {}
