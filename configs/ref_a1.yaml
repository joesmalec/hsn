# ref_a1: the Appendix C reference configuration A.1 as code (P1.1).
#
# V=256, d=64, N=32, M=8, K=4, R=1, D_g=4, H=512, 16 context symbols of width 64; 1,820,361
# parameters by the closed forms in python/hsn/train/memory_plan.py (print the Appendix C tables with
# `uv run python scripts/count_params.py --config configs/ref_a1.yaml`). The whole model block is
# written out so that the dimensions live here, not in code defaults (plan §4.3: configs are the
# single source of truth). Derived numbers (parameter count, memory, tokens/s) are never stored here;
# the run manifest records what was measured.

run_id: ref_a1
seed: 0
notes: "Appendix C reference configuration A.1 (1,820,361 parameters)."
profile: cpu # hardware profile: configs/hardware/<profile>.yaml; override with `profile=<name>`
model_name: hsn

model: # Appendix A.1
  vocab_size: 256 # byte vocabulary V
  d: 64 # width
  n_cells: 32 # N
  n_units: 8 # M
  k_select: 4 # K cells per round
  k_min: 1 # minimum selected cells
  r_max: 1 # internal rounds cap R
  in_degree: 4 # D_g
  random_edges: 0 # extra random candidate edges
  edge_norm: softmax # softmax | sigmoid
  hidden: 512 # H for every two-layer MLP
  n_context: 16 # context symbols
  context_dim: 64 # context embedding width (= d)
  activation: gelu # MLP activation (paper unspecified)
  init: trunc_normal_0.02 # weight init (paper unspecified)
  scorer: linear # linear | mlp; Appendix C counts the linear scorer (200 -> 8)
  scorer_hidden: 128 # hidden width when scorer = mlp (the C.2 "two-layer scorer" row)
  scorer_features:
    exclude: [] # feature names to zero (ablation; e.g. [eps])
  routing: dense # dense | topk | greedy_budget | random | fixed
  fixed_route: [] # cells for routing = fixed
  budget: 1.0 # B_t as a fraction of the dense step cost
  lambda_cost: 0.0 # lambda_cost in score = U - lambda * c
  deadline_ms: null # wall-clock deadline (serving)
  cost_profile: null # P2.1: cost profile (P0.6 report + cost_profile block) for the router's cost table; null = uniform placeholder
  static_k: true # pad selection to fixed K (needed for graphs / compile)
  age_max: 64 # refresh-probe threshold
  halt_threshold: 0.5 # inference halting threshold
  predictor_target: fixed_embedding # fixed_embedding | ema_encoder (P1.6)
  disabled_cells: [] # test hook
  ablate_shared_u: false # ablation: remove u from v (not covered by the P1.1 closed forms)
  state_schema_version: 1 # bumped on any state layout change

train: # Appendix A.3; the Appendix C.3 prototype: batch 4, unroll 256, 2-byte values
  unroll: 256 # TBPTT window T
  batch: 4 # B
  micro_batch: 4
  grad_accum: 1
  precision: bf16 # bf16 | fp16 | fp32 | fp64; sets the bytes per activation value in C.3
  # P2.2 routing controls at their defaults (nothing active with model.routing = dense; a hard-routed
  # run overrides model.routing and these keys on the command line)
  gate_mode: soft # soft | ste | reinforce: the estimator after the soft warm-up
  soft_until_step: 0 # steps trained with soft gates before gate_mode takes over
  temperature_start: 1.0 # tau of the soft mask / unit softmax, linear ramp over temperature_steps
  temperature_end: 1.0
  temperature_steps: 0
  epsilon_start: 0.0 # exploration rate: one selected cell replaced by a random one
  epsilon_end: 0.0
  epsilon_steps: 0
  p_dense: 0.0 # probability that a sample runs the dense step (charged to Selection.cost)
  reinforce_baseline_decay: 0.9 # EMA rate of the REINFORCE reward baseline (gate_mode = reinforce)
