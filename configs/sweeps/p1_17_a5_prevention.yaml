# A5 prevention hypotheses, frozen before the first run on this code version.
# 2 x 2 ablation plus slower-router control, existing seeds 0 and 1; no discarded finite batches.
# Caps are experimental settings based on exp235's reported module update ratios;
# no implementation threshold or step number was fitted to a spike.
name: p1_17_a5_prevention
description: "A5: proposed-update caps and decoder shortcut dropout, independently and together"
timing: true
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=none
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
seeds: [0, 1]
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
arms:
  - name: a5_unrestricted
    family: hsn
  - name: a5_update_limit
    family: hsn
    overrides:
      - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
      - train.update_limit.norm_floor=1e-12
  - name: a5_shortcut_dropout
    family: hsn
    overrides: [model.decoder_shortcut_dropout=0.5]
  - name: a5_limit_and_dropout
    family: hsn
    overrides:
      - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
      - train.update_limit.norm_floor=1e-12
      - model.decoder_shortcut_dropout=0.5
  - name: a5_router_slow
    family: hsn
    overrides: [train.router_lr_mult=0.3]
