# A6 + A4, the mid-run sag (10 Nov 2026). With the feedback cut, the candidate norm of amendment
# A4 learns fast (0.6 dev by step 1,500; exps 372, 375-377) and then loses 10 to 20 points between
# steps 2,000 and 4,000 on every seed before it recovers; gradient norms stay ordinary (largest
# 4.1 in exp 372) while the training loss rises, so this is not the burst of exps 345/346. During
# the constant-rate phase the cell and the router move at their caps (0.003 of their norm per
# step) and the uncapped groups faster: the encoder 0.007 to 0.009, the shared transform 0.005 to
# 0.008, the predictor about 0.01. The lr 1.5e-3 arm of p1_18_a6_wobble (exp 373, without A4) had
# no fall at all. These arms change one thing each on seed 1, the seed with the longest sag (exp
# 376), all scored on averaged weights:
#   lr15    the peak learning rate 1.5e-3;
#   capall  the same 0.003 cap on the encoder, the shared transform and the predictor (a group
#           each), so that none of them moves faster than the cell;
#   cap15   the cell's and the router's caps halved.
# They stop at step 5,000 of the 9,000-step schedule (train.steps stays 9,000, so the learning
# rate is the full runs' and the curves compare step for step with exps 375-377): the sag is over
# by then, and an arm that removes it is run to the end afterwards.
name: p1_18_a6_sag
description: "A6 + A4: what removes the sag at steps 2,000-4,000 (seed 1, against exp 376)"
timing: false
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=rms
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - train.feedback_detach=[summary,eps,state,router]
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
    - 'train.update_limit.norm_growth_limits={routing: 1.0}'
    - train.weight_ema=0.99
protocol:
  name: reads_state
  version: 3
  steps: 5000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [1]
arms:
  - name: lr15
    family: hsn
    overrides:
      - train.lr=1.5e-3
  - name: capall
    family: hsn
    overrides:
      - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}, encoder: {selectors: ["encoder.*"], max_ratio: 0.003}, shared: {selectors: ["shared.*"], max_ratio: 0.003}, predictor: {selectors: ["predictor.*"], max_ratio: 0.003}}'
  - name: cap15
    family: hsn
    overrides:
      - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.0015}, routing: {selectors: ["router.*"], max_ratio: 0.0015}}'
