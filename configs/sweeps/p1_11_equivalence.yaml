# P1.11 equivalence test (agreed with the coordinator and the audit session, 7 Nov 2026): does the
# harness train exactly as the audit's script? Both run the bridge recipe for 300 steps of its
# 3,000-step schedule with deterministic algorithms (train.deterministic=true and
# CUBLAS_WORKSPACE_CONFIG=:4096:8 in the environment), eager, evaluation every 100 steps at the
# training batch (as the script), diagnostics every 100 steps. The audit's side, from
# /home/joe/hsn-eff at f8884ec:
#
#   CUBLAS_WORKSPACE_CONFIG=:4096:8 .venv/bin/python scripts/eff_reads_state.py --out <dir> \
#     --batch 32 --lr 1e-3 --name <name> --steps 300 --eval-every 100 --diag-every 100 \
#     --override hardware.compile_mode=none --override train.deterministic=true \
#     --override train.steps=3000
#
# The harness's side is this spec. Training is the same when the step-300 checkpoints are bitwise
# equal (weights, optimiser state, loader position) and so are the evaluations and diagnostics.

name: p1_11_equivalence
description: harness vs the audit script, deterministic, 300 steps of the bridge recipe
base:
  config: configs/experiments/g1_ref_a1.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=none
    - train.batch=32
    - train.micro_batch=32
    - train.lr=0.001
    - train.steps=3000
    - train.eval_every=100
    - train.ckpt_every=300
    - train.stats_every=100
    - data.tasks=[delayed]
    - data.variants=[in_range]
    - train.deterministic=true
protocol:
  name: reads_state
  steps: 300
  diag_every: 100
  diag_docs: 32
  probe_batch: 64 # eval_batch unset: the training batch, as the script
seeds: [0]
arms:
  - name: bridge_det300
    family: hsn
