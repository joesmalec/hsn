# Same-budget controls for P1 (s2_wsd_cand_d64_15k), approved by the coordinator under the user's overnight mandate
# (8 Nov 02:35): gru_2m on WSD 0.2 over 15,000, seeds 0, 1, 2, at the lr P2 selected. P2 (s2_gru2m_lr9k): lr 5e-4 reached
# 0.7930 at 9,000 (exp 154; reads state), above 2.5e-3's 0.7761 (exp 143); lr 1e-3 stayed at chance (exp 153). Comparison
# controls only; rules and predictions registered in /home/joe/hsn-eff/evidence/EFF/AUDIT.md before any run.

name: s2_controls_15k
description: "Same-budget (15k) gru_2m controls for the HSN 15k arm: WSD 0.2 over 15k at lr 5e-4, seeds 0-2"
base:
  config: configs/baselines/gru_2m.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=none
    - train.batch=32
    - train.micro_batch=32
    - train.steps=15000
    - train.eval_every=500
    - train.ckpt_every=15000
    - train.stats_every=100
    - train.warmup_steps=200
    - train.weight_decay=0.01
    - train.schedule=cosine
    - train.grad_clip=1.0
    - data.tasks=[delayed]
    - data.variants=[in_range]
families:
  transformer:
    config: configs/baselines/transformer_2m.yaml
protocol: {name: reads_state, steps: 15000, diag_every: 500, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: false
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    reads_state: {preset: reads_state}
    beats_bar:
      cases:
        - label: above 0.7930
          when:
            all:
              - {metric: "eval:delayed/in_range/accuracy", steps: {at: 15000}, op: ">", value: 0.7930}
      default: not above 0.7930
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  - name: s2c_gru2m_wsd15k
    family: gru
    overrides: [train.lr=0.0005, train.schedule=wsd, train.decay_fraction=0.2]
    seeds: [0, 1, 2]
