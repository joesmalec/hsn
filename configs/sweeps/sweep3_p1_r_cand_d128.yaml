# Sweep 3, P1 (user approval 7 Nov 2026 20:58, via the coordinator): the d=128 memory check at R with
# model.cand_norm=rms, required by the registered gap rule before E2 at R + cand_norm. Rules, predictions and the
# architecture note were registered in /home/joe/hsn-eff/evidence/EFF/AUDIT.md before any run.
#
# exp 92's arm (r_cand_norm: dense HSN, B32, lr 2e-3, warm-up 200, train.steps 9000 (the schedule), protocol steps
# 600, evaluation every 100, diagnostics every 25, compiled) plus model.d=128. Architecture note: amendment A4
# (opt-in) plus the design option d. Expected step time about 0.35 to 0.36 s (exp 88, d=128 at R: 0.354 s).
#
# Pass rule (the registered memory check): over the 9 diagnostics at steps 400 to 600, the median gate p50 >= 0.01
# and the median grad_share/cell >= 0.01. Reading note 1: under cand_norm grad_share/cell scales as 1/||W||, so it
# is read with update_ratio/cell beside it; sat99/answer and gate p90 reported.

name: sweep3_p1_r_cand_d128
description: d=128 memory check at R (lr 2e-3, 600 of a 9k schedule) with cand_norm=rms (amendment A4)
base:
  config: configs/experiments/g1_ref_a1.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - train.batch=32
    - train.micro_batch=32
    - train.lr=0.002
    - train.steps=9000
    - train.eval_every=100
    - train.ckpt_every=9000
    - train.stats_every=100
    - data.tasks=[delayed]
    - data.variants=[in_range]
    - model.cand_norm=rms
protocol: {name: reads_state, steps: 600, diag_every: 25, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: true
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    memory_check_600:
      applies_to: {family: [hsn]}
      cases:
        - label: pass
          when:
            all:
              - {metric: "diag:gate/p50", steps: {from: 400, to: 600, every: 25}, agg: median, op: ">=", value: 0.01}
              - {metric: "diag:grad_share/cell", steps: {from: 400, to: 600, every: 25}, agg: median, op: ">=", value: 0.01}
      default: fail
    reads_state: {preset: reads_state}
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  - name: p1_r_cand_d128
    family: hsn
    overrides: [model.d=128]
