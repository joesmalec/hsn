# Same-budget controls for exp 136 (s2_wsd_cand_d64_9k: dense HSN, 9,000 steps, dev 0.7912), approved by the coordinator
# under the user's overnight mandate (8 Nov 01:05). The open-baseline bar (gru_2m 0.763, exp 108; transformer_2m 0.580,
# exp 119) comes from 3,000-step runs; these arms train the baselines for the same 9,000 steps. Rules, predictions and
# the final stop condition registered in /home/joe/hsn-eff/evidence/EFF/AUDIT.md before any run.
#
# The queue9 baseline recipe (B32, warm-up 200, weight decay 0.01, grad_clip 1.0, eval every 500, eager, sharing the
# card), delayed/in_range:
#   (c1) gru_2m (384x2) on WSD 0.2 over 9,000 at lr 2.5e-3 (exp 136's schedule and lr), seeds 0, 1, 2;
#   (c2) transformer_2m at lr 1.25e-4 (its best, exp 119) on a full cosine over 9,000 and on WSD 0.2 over 9,000, seed 0.
# (c3), transformer seeds 1 and 2 at its registered best (3,000 of a 9,000-step cosine at 1.25e-4), are arm-level seeds
# of s0b_tf2m_3k_of_9k in overnight_s0b_transformer_lr.yaml. Comparison controls only; about 0.02 to 0.05 s per step.

name: s2_controls_9k
description: "Same-budget (9k) open baselines for exp 136: gru_2m WSD 2.5e-3 seeds 0-2, transformer_2m 1.25e-4 cosine / WSD"
base:
  config: configs/baselines/gru_2m.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=none
    - train.batch=32
    - train.micro_batch=32
    - train.steps=9000
    - train.eval_every=500
    - train.ckpt_every=9000
    - train.stats_every=100
    - train.warmup_steps=200
    - train.weight_decay=0.01
    - train.schedule=cosine
    - train.grad_clip=1.0
    - data.tasks=[delayed]
    - data.variants=[in_range]
families:
  transformer:
    config: configs/baselines/transformer_2m.yaml
protocol: {name: reads_state, steps: 9000, diag_every: 500, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: false
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    reads_state: {preset: reads_state}
    beats_hsn:
      cases:
        - label: above exp 136 (0.7912)
          when:
            all:
              - {metric: "eval:delayed/in_range/accuracy", steps: {at: 9000}, op: ">", value: 0.7912}
      default: not above exp 136
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  # (c1) gru_2m on exp 136's recipe and budget
  - name: s2c_gru2m_wsd9k
    family: gru
    overrides: [train.lr=0.0025, train.schedule=wsd, train.decay_fraction=0.2]
    seeds: [0, 1, 2]
  # (c2) transformer_2m at its best lr on the full 9,000 steps
  - name: s2c_tf2m_cos9k
    family: transformer
    overrides: [train.lr=0.000125]
  - name: s2c_tf2m_wsd9k
    family: transformer
    overrides: [train.lr=0.000125, train.schedule=wsd, train.decay_fraction=0.2]
