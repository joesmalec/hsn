name: p1_17_delayed_gru_measurement
description: Delayed-only GRU 9k for the matched-task comparison and GPU telemetry.
timing: true
base:
  config: configs/baselines/gru_2m.yaml
  overrides:
  - profile=rtx3060
  - hardware.compile_mode=none
  - data.tasks=[delayed]
  - data.variants=[in_range]
  - train.batch=32
  - train.micro_batch=32
  - train.steps=9000
  - train.ckpt_every=9000
  - train.eval_every=500
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 500
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 3000
  keep_last: 3
seeds:
- 0
arms:
- name: gru_delayed_9000_logged
  family: gru
