# A6 + A4 with the route-takeover guard, the full-length comparison (10 Nov 2026).
#
# p1_18_a6_guard2 (seed 1, to step 5,000): with the guard's defaults the configuration that sagged
# holds 91 to 94 % from step 2,000 to 4,000 (exp 399; the same configuration without the guard,
# exp 376: 81 % at 2,000, 60 % at 4,000), the guard having halved the applied router step of the
# unit that was gaining established routes 14 times, at steps it chose itself. The more
# sensitive setting did the same (exp 401); restoring the gaining unit's rows was worse (exp 400).
#
# Arms: the default guard over the full 9,000 steps on the three controlled seeds, scored on
# averaged weights, against exps 375, 376, 377 (85.9 / 86.5 / 86.5 % with a 10 to 21 point sag).
name: p1_18_a6_guard_9k
description: "A6 + A4 with the route-takeover guard over 9,000 steps, seeds 0-2 (against exps 375-377)"
timing: false
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=rms
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - train.feedback_detach=[summary,eps,state,router]
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
    - 'train.update_limit.norm_growth_limits={routing: 1.0}'
    - train.weight_ema=0.99
    - train.route_guard.enabled=true
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [0, 1, 2]
arms:
  - name: guard
    family: hsn
