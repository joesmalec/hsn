# P2.10: the standard recipe (configs/experiments/hsn_recipe_a6.yaml) with the split training window
# (hardware.window=split, docs/p2_10_split_window.md) on seeds 0 to 5, 9,000 steps, diagnostics off.
# The comparison is the nine runs of the same recipe on the autograd window (exps 421-426, 430-432:
# 87.2 % dev accuracy on held-out keys, 78.5 to 95.6): the split window computes the same gradients
# (to bf16 rounding), so these runs should land in that spread, at about 0.056 s per step instead of 0.100.
# Configuration only; `hardware.window` is the one difference from example_p1_18.yaml's hsn_recipe arm.
name: p2_10_split_seeds
description: "the A6 recipe with the split training window on seeds 0-5 (against exps 421-426, 430-432)"
timing: false
base:
  config: configs/experiments/hsn_recipe_a6.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - hardware.window=split
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diagnostics: false # the user's rule for these runs (11 Nov 2026): no diagnostic samples
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [0, 1, 2, 3, 4, 5]
arms:
  - name: split
    family: hsn
