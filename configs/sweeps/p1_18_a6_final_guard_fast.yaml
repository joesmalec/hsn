# A6 + A4 with the route guard, how much its thresholds matter (overnight 10-11 Nov 2026;
# configuration only): the reader-targeted guard with a reading every 50 steps and an event at
# 5 % lost, on seeds 0 to 2 over 9,000 steps, against the defaults (exps 421-423: 86.2 / 93.3 /
# 88.9 %).
name: p1_18_a6_final_guard_fast
description: "A6 + A4 with the route guard's sensitive setting at 9k on seeds 0-2 (against exps 421-423)"
timing: false
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=rms
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - train.feedback_detach=[summary,eps,state,router]
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
    - 'train.update_limit.norm_growth_limits={routing: 1.0}'
    - train.weight_ema=0.99
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [0, 1, 2]
arms:
  # a reading every 50 steps and an event at 5 % lost, instead of 100 steps and 10 %
  - name: guard_fast
    family: hsn
    overrides:
      - train.route_guard.enabled=true
      - train.route_guard.interval=50
      - train.route_guard.lost_fraction=0.05
