# Overnight stage 0 (user instruction 7 Nov 21:30; batch approved by the coordinator): the open baselines only
# (the HSN pause holds). Rules and predictions registered in /home/joe/hsn-eff/evidence/EFF/AUDIT.md before any run.
#
# The queue9 baseline recipe (B32, warm-up 200, weight decay 0.01, grad_clip 1.0, eval every 500, eager, sharing the
# card), delayed/in_range, seed 0 unless stated:
#   transformer_2m (configs/baselines/transformer_2m.yaml: d_model 192, 4 layers, 4 heads, attention over the
#   256-position window) at E1's recipe (lr 3e-3, cosine over 3,000), at R (lr 2e-3, 3,000 of a 9,000-step cosine)
#   and on WSD 0.2 over 3,000 at lr 2.5e-3;
#   gru_2m (384x2) seeds 1 and 2 at R (seed 0, exp 102, diverged at 1,224) and on WSD 0.2 over 3,000 at lr 2.5e-3.
# Comparison controls only. Expected step time about 0.01 to 0.05 s (the transformer's is checked on its first arm;
# cancelled and reported if above 0.5 s).

name: overnight_s0_baselines
description: "Open baselines (transformer_2m, gru_2m) at E1's recipe, R and WSD 2.5e-3"
base:
  config: configs/baselines/gru_2m.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=none
    - train.batch=32
    - train.micro_batch=32
    - train.steps=3000
    - train.eval_every=500
    - train.ckpt_every=3000
    - train.stats_every=100
    - train.warmup_steps=200
    - train.weight_decay=0.01
    - train.schedule=cosine
    - train.grad_clip=1.0
    - data.tasks=[delayed]
    - data.variants=[in_range]
families:
  transformer:
    config: configs/baselines/transformer_2m.yaml
protocol: {name: reads_state, diag_every: 500, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: false
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    reads_state: {preset: reads_state}
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  # transformer_2m at the three recipes
  - name: s0_tf2m_e1
    family: transformer
    overrides: [train.lr=0.003]
  - name: s0_tf2m_r
    family: transformer
    overrides: [train.lr=0.002, train.steps=9000, train.ckpt_every=9000]
    protocol: {steps: 3000}
  - name: s0_tf2m_wsd
    family: transformer
    overrides: [train.lr=0.0025, train.schedule=wsd, train.decay_fraction=0.2]
  # gru_2m: seeds 1 and 2 at R, and WSD 2.5e-3
  - name: s0_gru2m_r
    family: gru
    overrides: [train.lr=0.002, train.steps=9000, train.ckpt_every=9000]
    protocol: {steps: 3000}
    seeds: [1, 2]
  - name: s0_gru2m_wsd
    family: gru
    overrides: [train.lr=0.0025, train.schedule=wsd, train.decay_fraction=0.2]
