# P1.13 GRU controls for the one lever that changes the GRU's recipe too: train.schedule=wsd (proposal of the
# P1.13 plan, approved by the user 7 Nov 2026; the audit registers the rules and predictions in AUDIT.md
# before any run).
#
# The queue9 GRU recipe (as sweep2_a_gapfill: B32, warm-up 200, weight decay 0.01, grad_clip 1.0, eager,
# about 0.005 to 0.012 s per step, the arms sharing the card), seed 0, with a self-contained 3,000-step WSD
# schedule (constant after the warm-up, a 1 - sqrt decay to 0 over the last 20 %, steps 2,401 to 3,000),
# trained the full 3,000 steps:
#   G1 to G6: 64x1 and 128x1 at lr 2e-3, 2.5e-3 and 3e-3.
# Question: does a 3,000-step WSD schedule detect width (128x1 reads state, 64x1 does not), as 3,000 of a
# 9,000-step cosine does at 2e-3 and 2.5e-3 (exps 83 to 86) and the 3,000-step cosine only at 3e-3?
# Rule (as block A's): per lr, the recipe detects width when 128x1 reads state and 64x1 does not.

name: p1_13_levers_gru_wsd
description: GRU 64x1 and 128x1 on a 3,000-step warmup-stable-decay schedule at lr 2e-3, 2.5e-3 and 3e-3
base:
  config: configs/baselines/gru_2m.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=none
    - train.batch=32
    - train.micro_batch=32
    - train.steps=3000
    - train.eval_every=500
    - train.ckpt_every=3000
    - train.stats_every=100
    - train.warmup_steps=200
    - train.weight_decay=0.01
    - train.schedule=wsd
    - train.decay_fraction=0.2
    - train.grad_clip=1.0
    - data.tasks=[delayed]
    - data.variants=[in_range]
protocol: {name: reads_state, diag_every: 500, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: false
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    reads_state: {preset: reads_state}
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  - name: g_gru64x1_wsd
    family: gru
    overrides: [baseline.gru.d_model=64, baseline.gru.n_layers=1]
    grid: {train.lr: [0.002, 0.0025, 0.003]}
  - name: g_gru128x1_wsd
    family: gru
    overrides: [baseline.gru.d_model=128, baseline.gru.n_layers=1]
    grid: {train.lr: [0.002, 0.0025, 0.003]}
