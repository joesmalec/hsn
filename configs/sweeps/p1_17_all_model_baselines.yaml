name: p1_17_all_model_baselines
description: Three baseline model families at 9k, 12k, and 27k steps; seed 0; canonical
  reads-state evaluation.
timing: true
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
  - profile=rtx3060
  - train.batch=32
  - train.micro_batch=32
  - train.eval_every=500
  - train.stats_every=100
  - data.variants=[in_range]
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 500
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 3000
  keep_last: 12
seeds:
- 0
constants:
  chance: 0.0208333
rules:
  verdicts:
    reads_state_v3:
      preset: reads_state_v3
arms:
- name: hsn_baseline_9000
  family: hsn
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
  - hardware.compile_mode=reduce-overhead
  - train.steps=9000
  - train.ckpt_every=9000
  - train.eval_every=500
  protocol:
    steps: 9000
    diag_every: 500
    diag_docs: 32
    eval_batch: 128
    probe_batch: 64
    checkpoint: retained
    keep_every: 3000
    keep_last: 12
- name: hsn_baseline_12000
  family: hsn
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
