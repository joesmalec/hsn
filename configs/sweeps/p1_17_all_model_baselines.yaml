  - train.eval_every=500
  protocol:
    steps: 12000
    diag_every: 500
    diag_docs: 32
    eval_batch: 128
    probe_batch: 64
    checkpoint: retained
    keep_every: 3000
    keep_last: 12
- name: hsn_baseline_27000
