# One controller switch off at a time, with matched seeds and unchanged quality gates.
# Enqueue only work that fits the owned compute window, through the existing worker.
name: p1_17_a5_adaptive_ablations
description: Measure the contribution of each adaptive controller signal on A5
timing: true
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=none
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=100
    - train.slow_burst_factor=10
    - train.slow_burst_window=250
    - train.rollback_every=50
    - train.rollback_skip=10
    - train.rollback_lr_mult=1
    - train.rollback_lr_steps=0
    - train.rollback_max=5
    - train.adaptive_lr.enabled=true
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
seeds: [0, 1]
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
arms:
  - name: full
    family: hsn
  - name: no_loss_cuts
    family: hsn
    overrides: [train.adaptive_lr.loss_cuts=false]
  - name: no_gradient_cuts
    family: hsn
    overrides: [train.adaptive_lr.gradient_cuts=false]
  - name: no_update_cuts
    family: hsn
    overrides: [train.adaptive_lr.update_cuts=false]
  - name: no_trial_increases
    family: hsn
    overrides: [train.adaptive_lr.trial_increases=false]
