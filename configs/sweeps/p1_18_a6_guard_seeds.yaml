# A6 + A4 with the route-takeover guard, more seeds and the sensitive setting (overnight 10-11 Nov
# 2026; configuration only). Same recipe and protocol as p1_18_a6_guard_9k (the default guard on
# seeds 0 to 2): the guard's sensitive setting on the same three seeds, and the default guard on
# seeds 3 and 4, 9,000 steps each, scored on averaged weights.
name: p1_18_a6_guard_seeds
description: "A6 + A4 with the route guard at 9k: the sensitive setting on seeds 0-2, the defaults on seeds 3-4"
timing: false
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=rms
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - train.feedback_detach=[summary,eps,state,router]
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
    - 'train.update_limit.norm_growth_limits={routing: 1.0}'
    - train.weight_ema=0.99
    - train.route_guard.enabled=true
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [0, 1, 2]
arms:
  # a reading every 50 steps and an event at 5 % lost (exp 401: 93.1 % at step 5,000 on seed 1)
  - name: guard_fast
    family: hsn
    overrides:
      - train.route_guard.interval=50
      - train.route_guard.lost_fraction=0.05
  # the defaults on two seeds no run of this work has used
  - name: guard
    family: hsn
    seeds: [3, 4]
