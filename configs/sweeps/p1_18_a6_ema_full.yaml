# A6, the recommended recipe with the weight average over 27,000 steps (10 Nov 2026), alone on the
# card: the long run against exp 371 (the same recipe scored on its training weights: 90.0 %), and
# the card's time series with the collector freeze (protocol.gc_freeze) and the compiled
# diagnostics both on (scripts/gpu_phase_report.py).
name: p1_18_a6_ema_full
description: "A6 carry_anchored + train.weight_ema=0.99 at 27k steps, a solo timing arm"
timing: true
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=none
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - train.feedback_detach=[summary,eps,state,router]
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
    - 'train.update_limit.norm_growth_limits={routing: 1.0}'
    - train.steps=27000
    - train.ckpt_every=27000
    - train.weight_ema=0.99
protocol:
  name: reads_state
  version: 3
  steps: 27000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 1500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [2]
arms:
  - name: ema99_27k
    family: hsn
