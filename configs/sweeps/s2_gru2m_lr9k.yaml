# Overnight P2 (approved by the coordinator under the user's overnight mandate, 8 Nov 02:35): bar fairness. gru_2m on
# WSD 0.2 over 9,000 (exp 136's schedule and budget) at lr 1e-3 and 5e-4, seed 0; at 2.5e-3 (exps 143 to 145) it reached
# 0.7761 / 0.020 / 0.022. The transformer's lr was tuned; gru_2m's never was at 9,000. If either beats 0.7761 it becomes
# the bar, and its lr is used for the 15,000-step controls. Comparison controls only; rules and predictions registered in
# /home/joe/hsn-eff/evidence/EFF/AUDIT.md before any run.

name: s2_gru2m_lr9k
description: "gru_2m lr check on WSD 0.2 over 9k (1e-3, 5e-4), seed 0: bar fairness for the HSN 9k/15k comparison"
base:
  config: configs/baselines/gru_2m.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=none
    - train.batch=32
    - train.micro_batch=32
    - train.steps=9000
    - train.eval_every=500
    - train.ckpt_every=9000
    - train.stats_every=100
    - train.warmup_steps=200
    - train.weight_decay=0.01
    - train.schedule=cosine
    - train.grad_clip=1.0
    - data.tasks=[delayed]
    - data.variants=[in_range]
families:
  transformer:
    config: configs/baselines/transformer_2m.yaml
protocol: {name: reads_state, steps: 9000, diag_every: 500, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: false
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    reads_state: {preset: reads_state}
    beats_c1:
      cases:
        - label: above 0.7761
          when:
            all:
              - {metric: "eval:delayed/in_range/accuracy", steps: {at: 9000}, op: ">", value: 0.7761}
      default: not above 0.7761
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  - name: s2c_gru2m_wsd9k_lr
    family: gru
    overrides: [train.schedule=wsd, train.decay_fraction=0.2]
    grid: {train.lr: [0.001, 0.0005]}
