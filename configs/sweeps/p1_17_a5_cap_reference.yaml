# Frozen before these trials. Same-code controls separate the anchored radius from wide clipping.
# Interleave matched seeds, failed historical seeds first, then the historical successful seed.
name: p1_17_a5_cap_reference
description: "Original memory/router caps versus an initial-norm ceiling on the router update radius"
timing: true
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=none
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
arms:
  - name: current_reference
    family: hsn
    seeds: [1]
  - name: anchored_router
    family: hsn
    seeds: [1]
    overrides: ['train.update_limit.norm_growth_limits={routing: 1.0}']
  - name: current_reference
    family: hsn
    seeds: [2]
  - name: anchored_router
    family: hsn
    seeds: [2]
    overrides: ['train.update_limit.norm_growth_limits={routing: 1.0}']
  - name: current_reference
    family: hsn
    seeds: [0]
  - name: anchored_router
    family: hsn
    seeds: [0]
    overrides: ['train.update_limit.norm_growth_limits={routing: 1.0}']
