# Second sweep, block A: the GRU positive-control map (user approval of evidence/EFF/NEXT_SWEEP_PROPOSAL.md,
# 7 Nov 2026). Rules and predictions were registered in /home/joe/hsn-eff/evidence/EFF/AUDIT.md before any run.
#
# The queue9 GRU recipe (configs/baselines/gru_2m.yaml; B32, warm-up 200, weight decay 0.01, cosine, grad_clip
# 1.0, 3,000 steps unless stated, eval every 500; eager), the arms sharing the card:
#   A1  128x1 at lr 2e-3 and 2.5e-3, 9,000 steps (schedule over 9,000): a cliff or a late onset below 3e-3?
#   A2  256x1 and 384x1 at lr 2e-3 and 2.5e-3: does the switch move with width? (context only: HSN at d=256
#       and B32 likely does not fit on the card)
#   A3  128x1 and 64x1 at lr 3e-3, seeds 1 and 2: is the width boundary at 3e-3 robust? Seed 0 is P1.11's
#       exps 44 (128x1, reads state, 0.6124) and 45 (64x1, does not, 0.0193), the same recipe
#   A4  64x1 and 128x1 at lr 3e-3 with warm-up 1,000 and 2,000: does the positive control survive the warm-ups
#       block B tries on HSN?
#
# Rule (registered): a recipe R detects width when 128x1 reads state and 64x1 does not; where 3 seeds exist
# (A3) at least 2 of 3 must agree on each, else seed 0. It is a reading across arms, made from the
# reads_state verdicts in the report.

name: sweep2_a_gru
description: GRU positive-control map at B32 (cliff or late onset, width, seeds, warm-ups) for the next HSN recipe
base:
  config: configs/baselines/gru_2m.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=none
    - train.batch=32
    - train.micro_batch=32
    - train.steps=3000
    - train.eval_every=500
    - train.ckpt_every=3000
    - train.stats_every=100
    - train.warmup_steps=200
    - train.weight_decay=0.01
    - train.schedule=cosine
    - train.grad_clip=1.0
    - data.tasks=[delayed]
    - data.variants=[in_range]
protocol: {name: reads_state, diag_every: 500, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: false
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    reads_state: {preset: reads_state, group: {min_agree: 2}}
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  # A1: late onset? 9,000 steps on a 9,000-step schedule
  - name: a1_gru128x1_9k
    family: gru
    overrides: [baseline.gru.d_model=128, baseline.gru.n_layers=1, train.steps=9000, train.ckpt_every=9000]
    grid: {train.lr: [0.002, 0.0025]}
  # A2: wider GRUs below 3e-3
  - name: a2_gru256x1
    family: gru
    overrides: [baseline.gru.d_model=256, baseline.gru.n_layers=1]
    grid: {train.lr: [0.002, 0.0025]}
  - name: a2_gru384x1
    family: gru
    overrides: [baseline.gru.d_model=384, baseline.gru.n_layers=1]
    grid: {train.lr: [0.002, 0.0025]}
  # A3: seeds of the width boundary at 3e-3 (seed 0 = exps 44, 45)
  - name: a3_gru128x1_lr3e-3
    family: gru
    overrides: [baseline.gru.d_model=128, baseline.gru.n_layers=1, train.lr=0.003]
    seeds: [0, 1, 2]
  - name: a3_gru64x1_lr3e-3
    family: gru
    overrides: [baseline.gru.d_model=64, baseline.gru.n_layers=1, train.lr=0.003]
    seeds: [0, 1, 2]
  # A4: the positive control under block B's warm-ups
  - name: a4_gru64x1_lr3e-3
    family: gru
    overrides: [baseline.gru.d_model=64, baseline.gru.n_layers=1, train.lr=0.003]
    grid: {train.warmup_steps: [1000, 2000]}
  - name: a4_gru128x1_lr3e-3
    family: gru
    overrides: [baseline.gru.d_model=128, baseline.gru.n_layers=1, train.lr=0.003]
    grid: {train.warmup_steps: [1000, 2000]}
