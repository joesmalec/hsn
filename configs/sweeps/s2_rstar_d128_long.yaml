# Overnight: exp 128's arm (dense HSN d=128 at R*, lr 1e-3, warm-up 200, B32, compiled) trained 9,000 steps on a
# cosine over 9,000 (train.steps 9000, protocol steps 9000), so the lr stays higher for longer (approved by the
# coordinator under the user's overnight mandate, 7 Nov 2026, after exp 128: v2 follow 0.445, dev 0.172 and rising).
# Rules and predictions registered in /home/joe/hsn-eff/evidence/EFF/AUDIT.md before the run.
#
# Architecture note: the d design option (recipe-only otherwise). Expected step time 0.347 s (exp 128); about 52 min of
# training plus a cached compile. Probe v2 alongside v1; diagnostics every 250 steps (gate p50 / p90, write rate,
# gate mean, cell share, saturation) reported. No gate-p50 rule or stop: exp 128 showed that rule misreads a
# sparse-write memory (gate p50 about 0.001 while the write rate rose from 0.6 % to 8.4 %). Stops only through P1.12's
# non-finite guard and P1.14's step-time guard (max_step_s 0.5).

name: s2_rstar_d128_long
description: "Dense HSN d=128 at R* (lr 1e-3) for 9,000 steps on a 9,000-step cosine, probe v2"
base:
  config: configs/experiments/g1_ref_a1.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - train.batch=32
    - train.micro_batch=32
    - train.lr=0.001
    - train.steps=9000
    - train.eval_every=500
    - train.ckpt_every=9000
    - train.stats_every=100
    - data.tasks=[delayed]
    - data.variants=[in_range]
    - model.d=128
protocol: {name: reads_state, version: 2, steps: 9000, diag_every: 250, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: true
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    reads_state: {preset: reads_state, group: {min_agree: 2}}
    reads_state_v2: {preset: reads_state_v2, group: {min_agree: 2}}
    cells_identical:
      applies_to: {family: [hsn]}
      cases:
        - label: identical
          when:
            all:
              - {metric: "trained:rank_pr/answer", op: "<=", value: 1.000001}
              - {metric: "trained:cell_spread/answer", op: "==", value: 0}
              - {metric: "trained:edge_logit/absmax", op: "==", value: 0}
      default: not identical
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  - name: s2_rstar_d128_long
    family: hsn
