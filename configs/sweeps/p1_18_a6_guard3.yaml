# A6 + A4, the route-takeover guard, third version (overnight 10-11 Nov 2026).
#
# The second version (every (input byte, unit) route; the response on the unit that gained most)
# held seed 1 at 90 to 93 % to step 5,000 once (exps 399, 401) and then failed on all three seeds
# over 9,000 steps (exps 402 to 404, stopped at step 4,000: 80.3 / 68.7 / 78.2 % after 88 to 93 %
# at 1,500 to 2,000). In exp 403 it fired twelve times and never on the unit that was taking the
# value positions: the filler's routes were moving between other units at the same time and
# counted as the event. In every run inspected the taker is the unit that serves the supervised
# positions. The guard now identifies those units from the loss mask and acts only when one of
# them is above its own record on bytes whose established routes belong to other units.
#
# Arms: the configuration that sagged with the default guard on the three controlled seeds, to
# step 5,000 of the 9,000-step schedule, scored on averaged weights.
name: p1_18_a6_guard3
description: "A6 + A4 with the reader-targeted route guard, seeds 0-2, to step 5,000"
timing: false
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=rms
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - train.feedback_detach=[summary,eps,state,router]
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
    - 'train.update_limit.norm_growth_limits={routing: 1.0}'
    - train.weight_ema=0.99
    - train.route_guard.enabled=true
protocol:
  name: reads_state
  version: 3
  steps: 5000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [0, 1, 2]
arms:
  - name: guard
    family: hsn
