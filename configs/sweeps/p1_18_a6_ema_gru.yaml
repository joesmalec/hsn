# The fairness check of the weight average (10 Nov 2026): the delayed-only GRU of exp 347
# (p1_17_delayed_gru_measurement: 77.8 %) scored on averaged weights too, so that the HSN's gain
# from `train.weight_ema` is compared with what the baseline gains from the same option.
name: p1_18_a6_ema_gru
description: "Delayed-only GRU 9k with train.weight_ema=0.99 (the baseline's share of the gain)"
timing: false
base:
  config: configs/baselines/gru_2m.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=none
    - data.tasks=[delayed]
    - data.variants=[in_range]
    - train.batch=32
    - train.micro_batch=32
    - train.steps=9000
    - train.ckpt_every=9000
    - train.eval_every=500
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 500
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 3000
  keep_last: 3
seeds: [0, 2]
arms:
  - name: gru_ema99
    family: gru
    overrides:
      - train.weight_ema=0.99
  # the same GRU without the average on the seed exp 347 did not run
  - name: gru_plain
    family: gru
    seeds: [2]
