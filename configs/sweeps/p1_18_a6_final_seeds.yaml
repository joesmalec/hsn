# A6 + A4, the overnight confirmation runs at 9,000 steps (10-11 Nov 2026; configuration only).
# The confirmed recipe is the feedback cut, the anchored caps, the candidate norm of A4 and the
# weight average (exps 375-377: 85.9 / 86.5 / 86.5 %, each with a mid-run sag). The route guard
# helped in some runs and not in others (p1_18_a6_guard2, _guard_9k, _guard3), so both are run
# here to the end: the recipe on three more seeds, and the guard on the three controlled seeds.
name: p1_18_a6_final_seeds
description: "A6 + A4 at 9k: three more seeds without the guard, and the reader-targeted guard on seeds 0-2"
timing: false
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=rms
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - train.feedback_detach=[summary,eps,state,router]
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
    - 'train.update_limit.norm_growth_limits={routing: 1.0}'
    - train.weight_ema=0.99
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [0, 1, 2]
arms:
  # the confirmed recipe (exps 375-377) on three seeds no run of this work has used
  - name: a4_ema99
    family: hsn
    seeds: [3, 4, 5]
  # the reader-targeted guard (third version) over the full length, against exps 375-377
  - name: guard
    family: hsn
    overrides:
      - train.route_guard.enabled=true
