# A6 + A4 without the sag (10 Nov 2026): confirmation on the other seeds and at full length.
#
# What the sag is (route-check, exps 375-377): at step 2,000 a value is written into the cells its
# key selects, and between steps 2,000 and 4,000 the router leaves that route. Three changes kept
# seed 1 on it (p1_18_a6_sag, p1_18_a6_sag2): the cell's and router's caps halved (exp 386: 89.5 %
# at step 5,000, later queries 87.8 %, key swap followed 91.1 %, verdict "binds keys"), a peak
# rate of 1.5e-3 (exp 384), and the train.adaptive_lr controller, whose only action by step 2,500
# was to halve the decoder's rate at step 400 (exp 389: 93.7 % at step 2,000).
#
# Arms (9,000 steps, scored on averaged weights):
#   cap15       the halved caps on seeds 0 and 2 (seed 1: exp 388);
#   adaptive    the controller over the full length, seeds 0 to 2;
#   readout05   the controller's one action as a fixed setting (train.readout_lr_mult=0.5), seed 1.
name: p1_18_a6_bind_seeds
description: "A6 + A4 without the sag: halved caps, the adaptive controller and a slower decoder at 9k"
timing: false
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=rms
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - train.feedback_detach=[summary,eps,state,router]
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
    - 'train.update_limit.norm_growth_limits={routing: 1.0}'
    - train.weight_ema=0.99
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [0, 1, 2]
arms:
  - name: cap15
    family: hsn
    seeds: [0, 2]
    overrides:
      - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.0015}, routing: {selectors: ["router.*"], max_ratio: 0.0015}}'
  - name: adaptive
    family: hsn
    overrides:
      - train.adaptive_lr.enabled=true
  - name: readout05
    family: hsn
    seeds: [1]
    overrides:
      - train.readout_lr_mult=0.5
