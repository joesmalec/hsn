# First stage after the A5 report: change beta2 only; retain evidence even after completion.
# Expand does not register or enqueue runs. The original A5 sweep remains reproducible.
name: p1_17_a5_b095
description: matched control and A5 at beta2 0.95, with pre-collapse checkpoints retained
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=none
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
seeds: [0, 1]
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
arms:
  - name: control
    family: hsn
  - name: a5
    family: hsn
    overrides: [model.key_address=true, model.selected_readout=true]
