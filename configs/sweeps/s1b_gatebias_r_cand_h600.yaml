# Stage 1 (b): gate_bias_init -2 and -1 at R with cand_norm (A4), d=64 then d=128, 600-step memory checks (the
# registered rule over [400, 600], min_samples 5), compiled. Architecture notes: an init (recipe-only) + A4 (+ d).
# Step times about 0.244 / 0.36 to 0.38 s.
# Rules and predictions registered in /home/joe/hsn-eff/evidence/EFF/AUDIT.md before any run (overnight mandate,
# 7 Nov 2026; batches approved by the coordinator). Probe v2 (P1.14) runs alongside v1; diagnostics every 25 steps
# inside the rule windows and every 500 elsewhere (full runs); min_samples 5 on windowed rules; gate/write_rate and
# gate/mean reported; max_step_s 0.5 (the default).

name: s1b_gatebias_r_cand_h600
description: "Stage 1 (b): gate_bias_init -2 / -1 at R with cand_norm, 600-step memory checks"
base:
  config: configs/experiments/g1_ref_a1.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - train.batch=32
    - train.micro_batch=32
    - train.lr=0.002
    - train.steps=9000
    - train.eval_every=100
    - train.ckpt_every=9000
    - model.cand_norm=rms
    - train.stats_every=100
    - data.tasks=[delayed]
    - data.variants=[in_range]
protocol: {name: reads_state, version: 2, steps: 600, diag_every: 25, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: true
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    memory_check_600:
      applies_to: {family: [hsn]}
      cases:
        - label: pass
          when:
            all:
              - {metric: "diag:gate/p50", steps: {from: 400, to: 600, every: 25}, agg: median, op: ">=", value: 0.01, min_samples: 5}
              - {metric: "diag:grad_share/cell", steps: {from: 400, to: 600, every: 25}, agg: median, op: ">=", value: 0.01, min_samples: 5}
      default: fail
    reads_state: {preset: reads_state}
    reads_state_v2: {preset: reads_state_v2}
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  - name: s1b_gb_m2_d64
    family: hsn
    overrides: [model.gate_bias_init=-2.0]
  - name: s1b_gb_m1_d64
    family: hsn
    overrides: [model.gate_bias_init=-1.0]
  - name: s1b_gb_m2_d128
    family: hsn
    overrides: [model.gate_bias_init=-2.0, model.d=128]
  - name: s1b_gb_m1_d128
    family: hsn
    overrides: [model.gate_bias_init=-1.0, model.d=128]
