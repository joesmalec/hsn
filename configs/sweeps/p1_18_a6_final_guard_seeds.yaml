# A6 + A4 with the route guard on the other three seeds (overnight 10-11 Nov 2026; configuration
# only). On seeds 0 to 2 the reader-targeted guard ended at 86.2 / 93.3 / 88.9 % (exps 421-423)
# against 85.9 / 86.5 / 86.5 % without it, with worst drawdowns of 5.8 / 1.8 / 8.7 points against
# 10.9 / 21.3 / 20.0. These arms are the same on seeds 3, 4 and 5, against exps 418-420 (84.7 /
# 82.1 / 84.6 %), so that both recipes have six seeds.
name: p1_18_a6_final_guard_seeds
description: "A6 + A4 with the reader-targeted route guard at 9k on seeds 3-5 (against exps 418-420)"
timing: false
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=rms
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - train.feedback_detach=[summary,eps,state,router]
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
    - 'train.update_limit.norm_growth_limits={routing: 1.0}'
    - train.weight_ema=0.99
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [3, 4, 5]
arms:
  - name: guard
    family: hsn
    overrides:
      - train.route_guard.enabled=true
