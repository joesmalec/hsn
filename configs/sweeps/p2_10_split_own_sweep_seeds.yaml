# P2.10: the split window with the model's own compiled sweep instead of the sweep twin
# (hardware.sweep_twin=false): the same replay and backward as configs/sweeps/p2_10_split_seeds.yaml,
# but the forward values round as the autograd window's compiled blocks do (the twin holds strictly
# rounded bf16 weights, the values of eager autocast). Seeds 0 to 2, diagnostics off. With
# p2_10_split_seeds and p2_10_autograd_seeds this separates the twin's effect from the split
# backward's. Configuration only.
name: p2_10_split_own_sweep_seeds
description: "the A6 recipe with the split window on the model's own sweep (no twin), seeds 0-2: is the twin's rounding visible in accuracy?"
timing: false
base:
  config: configs/experiments/hsn_recipe_a6.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - hardware.window=split
    - hardware.sweep_twin=false
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diagnostics: false # the user's rule for these runs (11 Nov 2026): no diagnostic samples
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [0, 1, 2]
arms:
  - name: split_own_sweep
    family: hsn
