# A6 + A4, the sag, second round (10 Nov 2026). In p1_18_a6_sag two changes kept seed 1 out of the
# sag through step 4,500 (87.3 % and 87.2 % there, against 69.2 % for exp 376, whose final score
# at 9,000 was 86.5 %): a peak learning rate of 1.5e-3 (exp 384) and the cell's and router's caps
# halved (exp 386). Capping the encoder, the shared transform and the predictor did not (exp 385).
# route-check on exps 375-377 says what the sag is: at step 2,000 a value is routed into the cells
# its key selects (overlap 0.44 to 0.51, 0.10 to 0.13 for other facts) and by step 3,000 to 4,000
# it no longer is (0.16 to 0.19): the router leaves the binding route.
#
# Arms, seed 1, all scored on averaged weights:
#   lr15_9k, cap15_9k   the two changes that held, over the full 9,000 steps (against exp 376);
#   adaptive            the triggered alternative to a fixed lower rate: the existing
#                       train.adaptive_lr controller at the recipe's 2.5e-3 (every 100 steps it
#                       scores 32 training documents and halves a group's rate when that loss
#                       worsens twice in a row), to step 5,000 of the 9,000-step schedule.
name: p1_18_a6_sag2
description: "A6 + A4: the two sag fixes at 9k and the triggered rate cut (seed 1, against exp 376)"
timing: false
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=rms
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - train.feedback_detach=[summary,eps,state,router]
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
    - 'train.update_limit.norm_growth_limits={routing: 1.0}'
    - train.weight_ema=0.99
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [1]
arms:
  - name: lr15_9k
    family: hsn
    overrides:
      - train.lr=1.5e-3
  - name: cap15_9k
    family: hsn
    overrides:
      - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.0015}, routing: {selectors: ["router.*"], max_ratio: 0.0015}}'
  - name: adaptive
    family: hsn
    overrides:
      - train.adaptive_lr.enabled=true
    protocol:
      steps: 5000
