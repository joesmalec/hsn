# queue9: the GRU learning-rate ladder that chooses E2's recipe (user decision, 7 Nov 2026, after the GRU
# controls at R* = B32 lr 1e-3 all stayed at chance; exps 50 to 52).
#
# At B32 the GRUs read state at lr 3e-3 (128x1 with its jump at 1,500 to 2,000 steps; 256x1 and 384x1 at 500 to
# 1,000) and not at lr 1e-3; GRU-64x1 did not read state at either. HSN's memory fails at lr 3e-3 (E1, exp 49:
# cell gradient share below 0.01 from step 350, state 59 % saturated). This ladder looks for a lower lr at which
# a width effect is detectable, as the positive control E2 needs.
#
# Arms: the queue9 GRU family recipe (configs/baselines/gru_2m.yaml; B32, 3,000 steps, warm-up 200, weight decay
# 0.01, cosine, grad_clip 1.0, eval every 500; eager), 64x1 and 128x1, lr 1.5e-3, 2e-3 and 2.5e-3, seed 0.
#
# Rule (registered 7 Nov before any run; also in /home/joe/hsn-eff/evidence/EFF/AUDIT.md): width is detectable
# at lr x when 128x1 reads state and 64x1 does not (reads_state verdict, seed 0). E2's lr is the lowest
# detectable lr of the ladder. If none qualifies, stop and report (no further lever without the user).

name: queue9_ladder
description: GRU lr ladder at B32 (64x1, 128x1; lr 1.5e-3 / 2e-3 / 2.5e-3) choosing E2's recipe
base:
  config: configs/baselines/gru_2m.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=none
    - train.batch=32
    - train.micro_batch=32
    - train.steps=3000
    - train.eval_every=500
    - train.ckpt_every=3000
    - train.stats_every=100
    - train.warmup_steps=200
    - train.weight_decay=0.01
    - train.schedule=cosine
    - train.grad_clip=1.0
    - data.tasks=[delayed]
    - data.variants=[in_range]
protocol: {name: reads_state, diag_every: 500, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: false
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    reads_state: {preset: reads_state}
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  - name: gru64x1_lad
    family: gru
    overrides: [baseline.gru.d_model=64, baseline.gru.n_layers=1]
    grid: {train.lr: [0.0015, 0.002, 0.0025]}
  - name: gru128x1_lad
    family: gru
    overrides: [baseline.gru.d_model=128, baseline.gru.n_layers=1]
    grid: {train.lr: [0.0015, 0.002, 0.0025]}
