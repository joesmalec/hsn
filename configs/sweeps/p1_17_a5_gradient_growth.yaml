# Follow-up to270: react to sustained raw-gradient growth, not update size.
# Matched to270/271's no-rollback/no-spike-skip recipe and existing controlled seeds.
name: p1_17_a5_gradient_growth
description: "A5 selective, reversible damping from measured group/global gradient growth"
timing: true
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=none
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.gradient_growth.enabled=true
    - 'train.gradient_growth.groups={memory: ["cell.*"], embedding: ["byte_emb.*"], routing: ["router.*"], shared_path: ["shared.*"]}'
    - train.gradient_growth.window=100
    - train.gradient_growth.reference_lag=500
    - train.gradient_growth.interval=100
    - train.gradient_growth.growth_threshold=1.5
    - train.gradient_growth.global_growth_threshold=1.25
    - train.gradient_growth.min_share=0.25
    - train.gradient_growth.share_power=1.0
    - train.gradient_growth.response_power=1.0
    - train.gradient_growth.recovery_threshold=1.1
    - train.gradient_growth.recovery_rate=0.1
    - train.gradient_growth.min_scale=0.25
    - train.gradient_growth.norm_floor=1e-12
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
seeds: [0, 1]
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
arms:
  - name: a5_gradient_growth
    family: hsn
