# A6 confirmation (10 Nov 2026): the recipes that held on seed 2 (p1_18_a6_screen, _clip, _bind),
# on the other two controlled seeds. Same base and protocol as the screens.
name: p1_18_a6_seeds
description: "A6 recipes on seeds 0 and 1 (seed 2: exps 348-359)"
timing: false
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=none
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [0, 1]
arms:
  # exp 349's recipe: every feedback read cut, with exp 346's anchored update caps
  - name: carry_anchored
    family: hsn
    overrides:
      - train.feedback_detach=[summary,eps,state,router]
      - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
      - train.update_limit.norm_floor=1e-12
      - 'train.update_limit.norm_growth_limits={routing: 1.0}'
