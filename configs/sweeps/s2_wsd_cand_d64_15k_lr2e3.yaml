# Overnight P1b (approved by the coordinator under the user's overnight mandate, 8 Nov 02:45): HSN lr fairness. gru_2m's
# lr is tuned at 9,000 (P2: 5e-4 0.7930 > 2.5e-3 0.7761 > 1e-3 chance); HSN's is not. The P1 arm (dense HSN d=64 +
# cand_norm, A4; WSD 0.2 over 15,000) at lr 2e-3 instead of 2.5e-3, seed 0 (2e-3 passed the memory check at R, exp 92;
# 1e-3 stayed at chance at 3,000, exp 129). Seeds 1 and 2 pre-approved only if seed 0 beats the bar while reading state.
# Rules and predictions registered in /home/joe/hsn-eff/evidence/EFF/AUDIT.md before the run.
#
# Architecture note: amendment A4 (opt-in); recipe-only change. Expected 0.24 s per step, about 62 min. beats_bar uses
# the best open baseline at registration (0.7930, exp 154); the stop condition uses the best at the time.

name: s2_wsd_cand_d64_15k_lr2e3
description: "Dense HSN d=64 + cand_norm on WSD 0.2 over 15,000 steps at lr 2e-3 (lr fairness), probe v2"
base:
  config: configs/experiments/g1_ref_a1.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - train.batch=32
    - train.micro_batch=32
    - train.lr=0.002
    - train.steps=15000
    - train.schedule=wsd
    - train.decay_fraction=0.2
    - train.eval_every=500
    - train.ckpt_every=15000
    - train.stats_every=100
    - data.tasks=[delayed]
    - data.variants=[in_range]
    - model.cand_norm=rms
protocol: {name: reads_state, version: 2, steps: 15000, diag_every: 250, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: true
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    reads_state: {preset: reads_state, group: {min_agree: 2}}
    reads_state_v2: {preset: reads_state_v2, group: {min_agree: 2}}
    beats_bar:
      cases:
        - label: above 0.7930
          when:
            all:
              - {metric: "eval:delayed/in_range/accuracy", steps: {at: 15000}, op: ">", value: 0.7930}
      default: not above 0.7930
    cells_identical:
      applies_to: {family: [hsn]}
      cases:
        - label: identical
          when:
            all:
              - {metric: "trained:rank_pr/answer", op: "<=", value: 1.000001}
              - {metric: "trained:cell_spread/answer", op: "==", value: 0}
              - {metric: "trained:edge_logit/absmax", op: "==", value: 0}
      default: not identical
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  - name: s2_wsd_cand_d64_15k_lr2e3
    family: hsn
    seeds: [0] # seeds 1 and 2 pre-approved only if seed 0 beats the bar while reading state
