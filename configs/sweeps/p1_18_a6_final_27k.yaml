# A6 + A4 over 27,000 steps (overnight 10-11 Nov 2026; configuration only), each run alone on
# the card with the worker's GPU time series (the collector freeze and the compiled diagnostics
# are on, so this is also the clean utilisation trace of section 4): the confirmed recipe, and the
# same with the reader-targeted route guard, on seed 2, against exp 371.
name: p1_18_a6_final_27k
description: "A6 + A4 at 27k steps, alone on the card: without and with the route guard (seed 2)"
timing: true
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=rms
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - train.feedback_detach=[summary,eps,state,router]
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
    - 'train.update_limit.norm_growth_limits={routing: 1.0}'
    - train.weight_ema=0.99
    - train.steps=27000
    - train.ckpt_every=27000
protocol:
  name: reads_state
  version: 3
  steps: 27000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 1500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [2]
arms:
  # the confirmed recipe over 27,000 steps, against exp 371 (the same without A4: 90.0 %)
  - name: a4_ema99_27k
    family: hsn
  - name: guard_27k
    family: hsn
    overrides:
      - train.route_guard.enabled=true
