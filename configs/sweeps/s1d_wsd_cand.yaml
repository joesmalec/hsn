# Stage 1 (d): dense HSN with cand_norm (amendment A4) on WSD 0.2 over 3,000 at lr 2.5e-3, d=64 and d=128, full
# 3,000 steps, compiled. The recipe detects width robustly (GRU 128x1 3 of 3, 64x1 0 of 3); bars: gru_2m 0.763
# (best seed) and transformer_2m 0.580. Architecture notes: A4; A4 + d. Step times about 0.244 / 0.36 to 0.38 s.
# Rules and predictions registered in /home/joe/hsn-eff/evidence/EFF/AUDIT.md before any run (overnight mandate,
# 7 Nov 2026; batches approved by the coordinator). Probe v2 (P1.14) runs alongside v1; diagnostics every 25 steps
# inside the rule windows and every 500 elsewhere (full runs); min_samples 5 on windowed rules; gate/write_rate and
# gate/mean reported; max_step_s 0.5 (the default).

name: s1d_wsd_cand
description: "Stage 1 (d): HSN + cand_norm on WSD 0.2 at 2.5e-3, d=64 and d=128"
base:
  config: configs/experiments/g1_ref_a1.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - train.batch=32
    - train.micro_batch=32
    - train.lr=0.0025
    - train.steps=3000
    - train.schedule=wsd
    - train.decay_fraction=0.2
    - train.eval_every=500
    - train.ckpt_every=3000
    - train.stats_every=100
    - data.tasks=[delayed]
    - data.variants=[in_range]
protocol: {name: reads_state, version: 2, steps: 3000, diag_every: 500, diag_dense_every: 25, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: true
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    reads_state: {preset: reads_state, group: {min_agree: 2}}
    reads_state_v2: {preset: reads_state_v2, group: {min_agree: 2}}
    memory_open: {preset: memory_open}
    memory_open_windowed: {preset: memory_open, window: 100, to_step: 3000, min_samples: 5}
    cells_apart: {preset: cells_apart}
    cells_identical:
      applies_to: {family: [hsn]}
      cases:
        - label: identical
          when:
            all:
              - {metric: "trained:rank_pr/answer", op: "<=", value: 1.000001}
              - {metric: "trained:cell_spread/answer", op: "==", value: 0}
              - {metric: "trained:edge_logit/absmax", op: "==", value: 0}
      default: not identical
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
  early_stop:
    - name: memory_shut_1500
      at_steps: [1500]
      outcome: "fail-early: memory shut at 1,000 and 1,500"
      applies_to: {family: [hsn]}
      when:
        all:
          - {metric: "diag:gate/p50", steps: {from: 800, to: 1000, every: 25}, agg: median, op: "<", value: 0.01, min_samples: 5}
          - {metric: "diag:grad_share/cell", steps: {from: 800, to: 1000, every: 25}, agg: median, op: "<", value: 0.01, min_samples: 5}
          - {metric: "diag:gate/p50", steps: {from: 1300, to: 1500, every: 25}, agg: median, op: "<", value: 0.01, min_samples: 5}
          - {metric: "diag:grad_share/cell", steps: {from: 1300, to: 1500, every: 25}, agg: median, op: "<", value: 0.01, min_samples: 5}
    - name: memory_shut_2000
      at_steps: [2000]
      outcome: "fail-early: memory shut at 1,500 and 2,000"
      applies_to: {family: [hsn]}
      when:
        all:
          - {metric: "diag:gate/p50", steps: {from: 1300, to: 1500, every: 25}, agg: median, op: "<", value: 0.01, min_samples: 5}
          - {metric: "diag:grad_share/cell", steps: {from: 1300, to: 1500, every: 25}, agg: median, op: "<", value: 0.01, min_samples: 5}
          - {metric: "diag:gate/p50", steps: {from: 1800, to: 2000, every: 25}, agg: median, op: "<", value: 0.01, min_samples: 5}
          - {metric: "diag:grad_share/cell", steps: {from: 1800, to: 2000, every: 25}, agg: median, op: "<", value: 0.01, min_samples: 5}
    - name: memory_shut_2500
      at_steps: [2500]
      outcome: "fail-early: memory shut at 2,000 and 2,500"
      applies_to: {family: [hsn]}
      when:
        all:
          - {metric: "diag:gate/p50", steps: {from: 1800, to: 2000, every: 25}, agg: median, op: "<", value: 0.01, min_samples: 5}
          - {metric: "diag:grad_share/cell", steps: {from: 1800, to: 2000, every: 25}, agg: median, op: "<", value: 0.01, min_samples: 5}
          - {metric: "diag:gate/p50", steps: {from: 2300, to: 2500, every: 25}, agg: median, op: "<", value: 0.01, min_samples: 5}
          - {metric: "diag:grad_share/cell", steps: {from: 2300, to: 2500, every: 25}, agg: median, op: "<", value: 0.01, min_samples: 5}
arms:
  - name: s1d_wsd_cand_d64
    family: hsn
    overrides: [model.cand_norm=rms]
  - name: s1d_wsd_cand_d128
    family: hsn
    overrides: [model.cand_norm=rms, model.d=128]
