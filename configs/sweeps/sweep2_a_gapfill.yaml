# Second sweep, block A gap-fill (user approval via the coordinator, 7 Nov 2026 about 18:30). Rules and
# predictions were registered in /home/joe/hsn-eff/evidence/EFF/AUDIT.md before any run.
#
# The queue9 GRU recipe (as sweep2_a_gru.yaml: B32, warm-up 200, weight decay 0.01, cosine, grad_clip 1.0, eval
# every 500, eager; about 0.005 to 0.012 s per step), seed 0, the arms sharing the card:
#   1. a1b: 64x1 at lr 2e-3 and 2.5e-3, 9,000 steps on a 9,000-step schedule. With A1's 128x1 (exps 62, 63)
#      it completes the width rule for those recipes.
#   2. a5: 64x1 and 128x1 at lr 2e-3 and 2.5e-3, 3,000 steps of a 9,000-step schedule (train.steps=9000,
#      protocol steps 3000; probe and verdicts at step 3,000, as E1 ran 600 of 3,000).
#
# Rule (registered), per recipe, seed 0: the recipe detects width when 128x1 reads state and 64x1 does not.

name: sweep2_a_gapfill
description: GRU gap-fill for the width rule (64x1 at 9k steps; 64x1 and 128x1 at 3k of a 9k schedule)
base:
  config: configs/baselines/gru_2m.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=none
    - train.batch=32
    - train.micro_batch=32
    - train.steps=9000
    - train.eval_every=500
    - train.ckpt_every=9000
    - train.stats_every=100
    - train.warmup_steps=200
    - train.weight_decay=0.01
    - train.schedule=cosine
    - train.grad_clip=1.0
    - data.tasks=[delayed]
    - data.variants=[in_range]
protocol: {name: reads_state, diag_every: 500, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: false
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    reads_state: {preset: reads_state}
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  # 1. 64x1 at 9,000 steps (completes A1)
  - name: a1b_gru64x1_9k
    family: gru
    overrides: [baseline.gru.d_model=64, baseline.gru.n_layers=1]
    grid: {train.lr: [0.002, 0.0025]}
  # 2. 3,000 steps of the 9,000-step schedule
  - name: a5_gru64x1_3k_of_9k
    family: gru
    overrides: [baseline.gru.d_model=64, baseline.gru.n_layers=1]
    grid: {train.lr: [0.002, 0.0025]}
    protocol: {steps: 3000}
  - name: a5_gru128x1_3k_of_9k
    family: gru
    overrides: [baseline.gru.d_model=128, baseline.gru.n_layers=1]
    grid: {train.lr: [0.002, 0.0025]}
    protocol: {steps: 3000}
