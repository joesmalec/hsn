# Overnight (approved by the coordinator under the user's overnight mandate, 8 Nov 04:00): HSN onset reliability at a
# lower lr. gru_2m's seed robustness came from lr tuning (5e-4: 3 of 3 onsets at 3,500 to 4,500; 2.5e-3: 1 of 3). Exp
# 136's arm (dense HSN d=64 + cand_norm, amendment A4; WSD 0.2 over 9,000; B32, warm-up 200, compiled) at lr 2e-3,
# seeds 0, 1, 2; compared with the 2.5e-3 seeds (exps 136 / 138 / 139: onsets about 3,250 / 6,000 / 8,250; dev 0.791 /
# 0.763 / 0.557; later-query 0.606 / 0.553 / 0.262). Rules and predictions registered in
# /home/joe/hsn-eff/evidence/EFF/AUDIT.md before any run. The dev ceiling for a key-blind reader is 0.800 (later 0.623).
#
# Architecture note: amendment A4 (opt-in); recipe-only change. Expected 0.24 s per step, about 37 min per seed.

name: s2_wsd_cand_d64_9k_lr2e3
description: "Dense HSN d=64 + cand_norm on WSD 0.2 over 9,000 steps at lr 2e-3 (onset reliability), seeds 0-2"
base:
  config: configs/experiments/g1_ref_a1.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - train.batch=32
    - train.micro_batch=32
    - train.lr=0.002
    - train.steps=9000
    - train.schedule=wsd
    - train.decay_fraction=0.2
    - train.eval_every=500
    - train.ckpt_every=9000
    - train.stats_every=100
    - data.tasks=[delayed]
    - data.variants=[in_range]
    - model.cand_norm=rms
protocol: {name: reads_state, version: 2, steps: 9000, diag_every: 250, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: true
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    reads_state: {preset: reads_state, group: {min_agree: 2}}
    reads_state_v2: {preset: reads_state_v2, group: {min_agree: 2}}
    beats_bar:
      cases:
        - label: above 0.7930
          when:
            all:
              - {metric: "eval:delayed/in_range/accuracy", steps: {at: 9000}, op: ">", value: 0.7930}
      default: not above 0.7930
    cells_identical:
      applies_to: {family: [hsn]}
      cases:
        - label: identical
          when:
            all:
              - {metric: "trained:rank_pr/answer", op: "<=", value: 1.000001}
              - {metric: "trained:cell_spread/answer", op: "==", value: 0}
              - {metric: "trained:edge_logit/absmax", op: "==", value: 0}
      default: not identical
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  - name: s2_wsd_cand_d64_9k_lr2e3
    family: hsn
    seeds: [0, 1, 2]
