# A6 + A4, the route-takeover guard, second version (10 Nov 2026).
#
# p1_18_a6_guard (exps 396-398) tested a guard that watched for routes lost to the unit with the
# most slots. In those runs the unit that takes the value-write positions is the one that reads
# the query keys, not the most-used one: the default guard never fired (92.2 % at step 2,500,
# 70.7 % at 4,500), and the sensitive one froze the wrong unit (88.8 % to 72.7 %). The guard now
# tracks every (input byte, unit) route, reads the loss of the quarter of the bytes that lost
# most, and halves the applied router step of the unit that gained those routes.
#
# Arms: the configuration that sagged (seed 1, caps 0.003, lr 2.5e-3) with the guard, to step
# 5,000 of the 9,000-step schedule, scored on averaged weights.
#   guard          the defaults (a reading every 100 steps, an event at 10 % lost);
#   guard_fast     a reading every 50 steps, an event at 5 % lost.
# A third arm, guard_restore (exp 400: 77.9 % at step 5,000 against 90.3 % for guard), also put
# the gaining unit's rows back to the previous reading (`train.route_guard.restore`). The option
# was removed on 11 Nov 2026 and the arm with it; this file as it ran is at commit adeb660.
name: p1_18_a6_guard2
description: "A6 + A4 with the per-route takeover guard (seed 1, to step 5,000, against exps 376 and 396-398)"
timing: false
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=rms
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - train.feedback_detach=[summary,eps,state,router]
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
    - 'train.update_limit.norm_growth_limits={routing: 1.0}'
    - train.weight_ema=0.99
    - train.route_guard.enabled=true
protocol:
  name: reads_state
  version: 3
  steps: 5000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [1]
arms:
  - name: guard
    family: hsn
  - name: guard_fast
    family: hsn
    overrides:
      - train.route_guard.interval=50
      - train.route_guard.lost_fraction=0.05
