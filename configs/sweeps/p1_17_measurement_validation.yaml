name: p1_17_measurement_validation
description: 'One-hour logging validation: short HSN check, seeded cap comparison,
  delayed-only GRU reference.'
timing: true
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
  - profile=rtx3060
  - hardware.compile_mode=reduce-overhead
  - model.routing=topk
  - model.cand_norm=none
  - model.key_address=true
  - model.selected_readout=true
  - train.optimizer=lazy_adamw
  - train.gate_mode=ste
  - train.lr=2.5e-3
  - train.betas=[0.9,0.95]
  - train.probe_horizon=null
  - train.spike_factor=null
  - train.rollback_every=null
  - train.grad_norm_precision=float64
  - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003},
    routing: {selectors: ["router.*"], max_ratio: 0.003}}'
  - train.update_limit.norm_floor=1e-12
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
  diag_stability: true
  diag_sensitivity_epsilon: 0.001
  diag_sensitivity_position: 64
  diag_sensitivity_horizon: 8
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3:
      preset: reads_state_v3
    binds_keys:
      preset: binds_keys
arms:
- name: logging_check
  family: hsn
  seeds:
  - 2
  overrides:
  - 'train.update_limit.norm_growth_limits={routing: 1.0}'
  - train.eval_every=100
  protocol:
    steps: 200
    diag_every: 100
    keep_every: 100
    keep_last: 2
- name: current_reference_logged
  family: hsn
  seeds:
  - 2
- name: anchored_router_logged
  family: hsn
  seeds:
  - 2
  overrides:
  - 'train.update_limit.norm_growth_limits={routing: 1.0}'
seeds:
- 2
