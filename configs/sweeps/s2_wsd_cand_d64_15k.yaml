# Overnight P1 (approved by the coordinator under the user's overnight mandate, 8 Nov 02:35): exp 136's arm (dense HSN
# d=64 + cand_norm, amendment A4; lr 2.5e-3; B32, warm-up 200, compiled) trained 15,000 steps on WSD 0.2 over 15,000
# (constant to 12,000, then the 1 - sqrt decay), seeds 0, 1, 2. At 9,000 steps all three seeds read state (0.791 / 0.763 /
# 0.557) with seed-dependent onsets (about 3,250 / 6,000 / 8,250) and seeds 1 / 2 still rising; the stop condition was
# not met (gru_2m seed 0 at 9,000: 0.7761). Same-budget gru_2m controls at 15,000 in s2_controls_15k.yaml. Rules and
# predictions registered in /home/joe/hsn-eff/evidence/EFF/AUDIT.md before any run.
#
# Architecture note: amendment A4 (opt-in); recipe-only change from exp 136. Expected 0.24 s per step, about 62 min per
# seed. Diagnostics every 250 steps. beats_bar uses the bar at registration (0.7761); the registered stop condition
# compares against the best open-baseline result at the time, including the 15,000-step controls.

name: s2_wsd_cand_d64_15k
description: "Dense HSN d=64 + cand_norm on WSD 0.2 over 15,000 steps at lr 2.5e-3, probe v2, seeds 0-2"
base:
  config: configs/experiments/g1_ref_a1.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - train.batch=32
    - train.micro_batch=32
    - train.lr=0.0025
    - train.steps=15000
    - train.schedule=wsd
    - train.decay_fraction=0.2
    - train.eval_every=500
    - train.ckpt_every=15000
    - train.stats_every=100
    - data.tasks=[delayed]
    - data.variants=[in_range]
    - model.cand_norm=rms
protocol: {name: reads_state, version: 2, steps: 15000, diag_every: 250, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: true
constants:
  chance: 0.0208333
seeds: [0]
rules:
  verdicts:
    reads_state: {preset: reads_state, group: {min_agree: 2}}
    reads_state_v2: {preset: reads_state_v2, group: {min_agree: 2}}
    beats_bar:
      cases:
        - label: above 0.7761
          when:
            all:
              - {metric: "eval:delayed/in_range/accuracy", steps: {at: 15000}, op: ">", value: 0.7761}
      default: not above 0.7761
    cells_identical:
      applies_to: {family: [hsn]}
      cases:
        - label: identical
          when:
            all:
              - {metric: "trained:rank_pr/answer", op: "<=", value: 1.000001}
              - {metric: "trained:cell_spread/answer", op: "==", value: 0}
              - {metric: "trained:edge_logit/absmax", op: "==", value: 0}
      default: not identical
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  - name: s2_wsd_cand_d64_15k
    family: hsn
    seeds: [0, 1, 2]
