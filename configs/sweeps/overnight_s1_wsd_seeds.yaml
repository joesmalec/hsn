# Overnight: seeds 1 and 2 at WSD 0.2 over 3,000 at lr 2.5e-3, the recipe of stage 1 (d) (approved by the coordinator
# under the user's overnight mandate, 7 Nov 2026). Rules and predictions registered in
# /home/joe/hsn-eff/evidence/EFF/AUDIT.md before any run.
#
# The queue9 baseline recipe (B32, warm-up 200, weight decay 0.01, grad_clip 1.0, eval every 500, eager, sharing the
# card), WSD 0.2 over 3,000 at lr 2.5e-3, seeds 1 and 2 of: gru_2m (seed 0: exp 108), GRU 128x1 (seed 0: exp 98) and
# GRU 64x1 (seed 0: exp 95). Each arm's seed-0 arm id equals that experiment's (checked with expand), so the seeds
# group with it. Comparison controls only; about 0.005 to 0.05 s per step.

name: overnight_s1_wsd_seeds
description: "Seeds 1 and 2 of gru_2m, GRU 128x1 and 64x1 on WSD 0.2 over 3k at lr 2.5e-3"
base:
  config: configs/baselines/gru_2m.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=none
    - train.batch=32
    - train.micro_batch=32
    - train.steps=3000
    - train.eval_every=500
    - train.ckpt_every=3000
    - train.stats_every=100
    - train.warmup_steps=200
    - train.weight_decay=0.01
    - train.schedule=wsd
    - train.decay_fraction=0.2
    - train.grad_clip=1.0
    - train.lr=0.0025
    - data.tasks=[delayed]
    - data.variants=[in_range]
protocol: {name: reads_state, diag_every: 500, diag_docs: 32, eval_batch: 128, probe_batch: 64}
timing: false
constants:
  chance: 0.0208333
seeds: [1, 2]
rules:
  verdicts:
    reads_state: {preset: reads_state, group: {min_agree: 2}}
    nonfinite_skips:
      cases:
        - label: none skipped
          when:
            all:
              - {metric: "final:skipped_nonfinite_steps", op: "==", value: 0}
      default: some skipped
arms:
  - name: s1w_gru2m
    family: gru
  - name: s1w_gru128x1
    family: gru
    overrides: [baseline.gru.d_model=128, baseline.gru.n_layers=1]
  - name: s1w_gru64x1
    family: gru
    overrides: [baseline.gru.d_model=64, baseline.gru.n_layers=1]
