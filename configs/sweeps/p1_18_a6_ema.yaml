# A6, the weight average and the candidate norm (10 Nov 2026).
#
# The recipe of exps 349/360/361/371 (every feedback read cut, anchored update caps) no longer
# collapses, but its dev accuracy still moves 1.8 to 3.0 points between evaluations. A replay of
# exp 371 from step 15,000 (probe/ema_probe.py, an evaluation every 100 steps) showed that this is
# noise of the last few optimiser steps and not of the solution: an exponential moving average of
# the weights scored 85.3 % (83.5 to 86.4) where the training weights scored 79.6 % (70.0 to
# 83.2). `train.weight_ema` makes the average what the run's evaluations and probes score;
# training is unchanged, step for step.
#
# p1_18_a6_wobble's `a4` arm (exp 372) is the other finding: with the feedback cut, the candidate
# norm of amendment A4 (`model.cand_norm=rms`), which diverged under full backpropagation (exp
# 350), trains without a burst and ends at 88.9 % (later 80.5 %, swap follow 61.1 %) on seed 2,
# with one slow 14-point excursion at steps 2,500 to 3,500.
#
# Arms: the recipe with the average, with and without A4, on the three controlled seeds (against
# exps 360, 361, 349 and 372), and one seed with a longer average.
name: p1_18_a6_ema
description: "A6 carry_anchored scored on averaged weights (train.weight_ema), with and without A4"
timing: false
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=none
    - model.key_address=true
    - model.selected_readout=true
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.95]
    - train.probe_horizon=null
    - train.spike_factor=null
    - train.rollback_every=null
    - train.grad_norm_precision=float64
    - train.feedback_detach=[summary,eps,state,router]
    - 'train.update_limit.groups={memory: {selectors: ["cell.*"], max_ratio: 0.003}, routing: {selectors: ["router.*"], max_ratio: 0.003}}'
    - train.update_limit.norm_floor=1e-12
    - 'train.update_limit.norm_growth_limits={routing: 1.0}'
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  checkpoint: retained
  keep_every: 500
  keep_last: 18
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
seeds: [0, 1, 2]
arms:
  - name: a4_ema99
    family: hsn
    overrides:
      - model.cand_norm=rms
      - train.weight_ema=0.99
  - name: ema99
    family: hsn
    overrides:
      - train.weight_ema=0.99
  - name: ema998
    family: hsn
    seeds: [2]
    overrides:
      - train.weight_ema=0.998
