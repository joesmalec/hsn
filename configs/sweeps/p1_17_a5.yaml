# A5's two-seed mechanism check and separate feature ablations. Expand does not enqueue a run.
# Uses the documented exp-196 settings, explicit beta2=.999; no adoption or speed claim.
name: p1_17_a5
description: fixed key addresses and selected-cell readout, with independent ablations
base:
  config: configs/experiments/hsn_recipe_b095.yaml
  overrides:
    - profile=rtx3060
    - hardware.compile_mode=reduce-overhead
    - model.routing=topk
    - model.cand_norm=none
    - train.optimizer=lazy_adamw
    - train.gate_mode=ste
    - train.lr=2.5e-3
    - train.betas=[0.9,0.999]
    - train.probe_horizon=null # if utility is enabled, include delayed writes; lambda_u stays zero
protocol:
  name: reads_state
  version: 3
  steps: 9000
  diag_every: 250
  diag_docs: 32
  eval_batch: 128
  probe_batch: 64
  keep_every: 1000
  keep_last: 2
seeds: [0, 1]
constants:
  chance: 0.0208333
  key_blind_later: 0.623
rules:
  verdicts:
    reads_state_v3: {preset: reads_state_v3}
    binds_keys: {preset: binds_keys}
arms:
  - name: control
    family: hsn
  - name: address_only
    family: hsn
    overrides: [model.key_address=true]
  - name: readout_only
    family: hsn
    overrides: [model.selected_readout=true]
  - name: a5
    family: hsn
    overrides: [model.key_address=true, model.selected_readout=true]
