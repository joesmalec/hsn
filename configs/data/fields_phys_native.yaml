# fields_phys_native: physics native of the field datasets (19-20 Nov 2026; docs/field_datasets.md).
#
# Source: arXiv metadata snapshot (the Kaggle snapshot, mirrored weekly),
#   https://huggingface.co/datasets/librarian-bots/arxiv-metadata-snapshot at commit c428226b689a0e17db2cd55265133b9eca15d97f
#   Licence: CC0-1.0 (arXiv metadata, abstracts included).
# Source: arXiv LaTeX bodies of proof-pile-2 (the RedPajama arXiv set), every tenth train file,
#   https://huggingface.co/datasets/EleutherAI/proof-pile-2 at commit 901a9273a770e9d4138c5ddd91802f9c5c6cdc4b
#   Licence: per paper; only papers whose arXiv licence is Creative Commons (BY, BY-SA, BY-NC,
#   BY-NC-SA, BY-NC-ND) or public domain (CC0) are kept.
#
# Document: a piece (<= 16 KiB, cut at paragraph ends) of an openly licensed physics paper's LaTeX
# body; capped at 16384 bytes, at least 64. Split by blake2b('fields_phys_native/<key>') mod 10000:
# below 2000 held out (python/hsn/data/fields.py).
#
# The raw files (not in the repository) come from the pinned sources (the build checks their
# SHA-256):
#
#   python -m hsn.data.fields fetch fields_phys_native --root <dir>
#   python -m hsn.data.fields convert fields_phys_native --root <dir>     # <dir>/raw/fields_phys_native/
#   python -m hsn.data.text build --spec configs/data/fields_phys_native.yaml \
#       --raw <dir>/raw/fields_phys_native --out data/fields_phys_native \
#       --golden configs/data/fields_phys_native.manifest.json
#
# Select it with
#   data.dataset=fields_phys_native data.manifest=data/fields_phys_native/manifest.json
#   data.tasks=[fields_phys_native] data.variants=[out_of_range]
# Golden manifest: configs/data/fields_phys_native.manifest.json.

name: fields_phys_native
unroll: 256
task: fields_phys_native
variant: out_of_range # documents are longer than a window
family: text
context_id: 14 # LaTeX
separator: "<|endoftext|>"
min_bytes: 64
newline: 16
tab: 17
max_train_tokens: 200000000
n_dev: 2000
n_test: 2000
n_gram: 32

train:
  file: train.txt
  sha256: ec7184dff32fa4feae5c686d976b6c075c7b0e06cc45d2e0566c685a7d63098b

heldout:
  file: heldout.txt
  sha256: 4557ac6f3b0cec945e27824e52c1ebbac9710dddb9d259386f16b8de80834e0b
