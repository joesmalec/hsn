# fields_bio_native: biology native of the field datasets (19-20 Nov 2026; docs/field_datasets.md).
#
# Source: UniRef50 protein clusters (UniProt), the head of each length-sorted file,
#   https://huggingface.co/datasets/agemagician/uniref50 at commit cc382ac670d6f715e90541f7a60eb3a66381a70c
#   Licence: CC BY 4.0 (UniProt).
#
# Document: one UniRef50 representative protein sequence (amino-acid letters); capped at 16384
# bytes, at least 64. Split by blake2b('fields_bio_native/<key>') mod 10000: below 150 held out
# (python/hsn/data/fields.py).
#
# The raw files (not in the repository) come from the pinned sources (the build checks their
# SHA-256):
#
#   python -m hsn.data.fields fetch fields_bio_native --root <dir>
#   python -m hsn.data.fields convert fields_bio_native --root <dir>     # <dir>/raw/fields_bio_native/
#   python -m hsn.data.text build --spec configs/data/fields_bio_native.yaml \
#       --raw <dir>/raw/fields_bio_native --out data/fields_bio_native \
#       --golden configs/data/fields_bio_native.manifest.json
#
# Select it with
#   data.dataset=fields_bio_native data.manifest=data/fields_bio_native/manifest.json
#   data.tasks=[fields_bio_native] data.variants=[out_of_range]
# Golden manifest: configs/data/fields_bio_native.manifest.json.

name: fields_bio_native
unroll: 256
task: fields_bio_native
variant: out_of_range # documents are longer than a window
family: text
context_id: 12 # protein sequences
separator: "<|endoftext|>"
min_bytes: 64
newline: 16
tab: 17
max_train_tokens: 200000000
n_dev: 2000
n_test: 2000
n_gram: 32

train:
  file: train.txt
  sha256: 8d58aee4d3212c93d28cb59db279a897542d842d903b37bb853d2761e9b872ed

heldout:
  file: heldout.txt
  sha256: 4e5d31821af34062639528015e9efab7d9f99866e4d6829d6f98ad266a11814e
