# fields_chem_prose: chemistry prose of the field datasets (19-20 Nov 2026; docs/field_datasets.md).
#
# Source: ChemRxiv preprints as text (ChemNLP, Jablonka group; PDFs converted to Markdown with LaTeX math), the train split,
#   https://huggingface.co/datasets/jablonkagroup/chemrxiv_processed at commit 341cc642b3db7de4a6966d73d0d860e5bbfb3240
#   Licence: per paper: CC BY 4.0, CC BY-NC 4.0 or CC BY-NC-ND 4.0 (every paper of the set).
#
# Document: a piece (<= 16 KiB, cut at paragraph ends) of a ChemRxiv preprint's text; capped at
# 16384 bytes, at least 64. Split by blake2b('fields_chem_prose/<key>') mod 10000: below 1000 held
# out, below 5000 used (python/hsn/data/fields.py).
#
# The raw files (not in the repository) come from the pinned sources (the build checks their
# SHA-256):
#
#   python -m hsn.data.fields fetch fields_chem_prose --root <dir>
#   python -m hsn.data.fields convert fields_chem_prose --root <dir>     # <dir>/raw/fields_chem_prose/
#   python -m hsn.data.text build --spec configs/data/fields_chem_prose.yaml \
#       --raw <dir>/raw/fields_chem_prose --out data/fields_chem_prose \
#       --golden configs/data/fields_chem_prose.manifest.json
#
# Select it with
#   data.dataset=fields_chem_prose data.manifest=data/fields_chem_prose/manifest.json
#   data.tasks=[fields_chem_prose] data.variants=[out_of_range]
# Golden manifest: configs/data/fields_chem_prose.manifest.json.

name: fields_chem_prose
unroll: 256
task: fields_chem_prose
variant: out_of_range # documents are longer than a window
family: text
context_id: 10 # the three abstract and paper-prose sets share 10 (ids 0-15; 0 is padding, 1-9 taken)
separator: "<|endoftext|>"
min_bytes: 64
newline: 16
tab: 17
max_train_tokens: 200000000
n_dev: 2000
n_test: 2000
n_gram: 32

train:
  file: train.txt
  sha256: 9779977d0ecf9a87a54a7e6ee2e6ad535fa9779a98c7dd348090316857cb94b3

heldout:
  file: heldout.txt
  sha256: 7dcb410b69410826fb3f8c92ce7aed82032a718176a5b76067c1927537c8a3e6
