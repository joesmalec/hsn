# hsn_t_memory_words_carry_bal_qk_write: the QK-norm recipe with the keyed word cells written by the HSN, the
# cross-window gradient into the write, and the carried reader compiled in its CUDA arm (the user's decision of 26 Nov
# 2026: "lets make this the recipe", the HSN write with the compiled reader).
#
# hsn_t_memory_words_carry_bal_qk.yaml is unchanged (past runs and specs use it).
# This file is hsn_t_memory_words_carry_bal_qk.yaml with four keys changed, written out:
#   model.word_cells hash, model.word_cells_value word: the keyed word cells with the HSN's own write
#   (docs/amendments/word_cells.md, stage 2). Beside the routed cells, 1,024 cells a row are keyed by a hash of a
#   word's first 1 to 3 bytes; once a window, for the last word end of each key, the HSN writes the key's cell with
#   the routed cells' units, gate, W_out, V and scorer (the convex tanh-gated update, D_g in-edges from the routed
#   cells); at every byte inside a word the decoder reads the cell of the prefix so far (a tag match, a map U per
#   offset, two age inputs). hsn_t_memory_words_carry_bal_qk.yaml: off, bytes.
#   train.tbptt_windows 3, train.grad_accum 3: three windows an optimiser step in one gradient segment, so that the
#   later windows' reads train the write (docs/tbptt_windows.md). With every window detached the write's own
#   parameters never move: on the 9k-window screens (3,000 steps x 3 windows) the HSN write reached 0.27 (bio prose)
#   and 0.17 (code native) of the table's swap delta detached, 0.99 and 0.87 with the segments.
#   hsn_t_memory_words_carry_bal_qk.yaml: 1, 1.
# The keyed cells' other keys keep their code defaults (model.word_cells_n 1024, _ways 2, _levels 3, _min_len 1,
# _gate_bias 3.0).
# It resolves to hsn_t_memory_words_carry_bal_qk.yaml with those four overrides exactly (the same configuration hash
# once run_id and notes are aligned, on the CPU profile and with the card's lines:
# tests/test_hsn_t_memory_words_carry_bal_qk_write_recipe.py). With the code-native data lines and the CUDA arm's
# lines below, a spec on it expands to the arm id of the measured run with the compiled reader, 5a3d0954ca98e44c (spec
# fields_27k_wcells_rcomp), and without hardware.reader_compile to the HSN write's run, 69e767e8700385e8 (spec
# fields_27k_wcells_word).
# 3,405,689 trainable parameters (the measured runs' param_count): hsn_t_memory_words_carry_bal_qk.yaml's 3,298,105,
# the read maps U (16 x 64 x 64 = 65,536), the decoder's 66 new input columns (33,792), and the write's in-edge
# logits (1,024 x 4), beta_K (64) and V_s (64 x 64), 8,256 together.
#
# The CUDA arm's lines. Hardware keys stay arm lines, as in the parent: a `hardware` block in this file would replace
# the whole profile, and the CPU profile of this file refuses the fused block and the reader compile.
#   hardware.compile_mode=default: a gradient segment cannot run under CUDA graphs, so the measured arms override the
#     family lines' reduce-overhead with it (with reduce-overhead, train.tbptt_windows=3 is refused at load);
#   hardware.graph_alias_index=true, hardware.message_gradients=state, hardware.round_products=merged,
#     hardware.event_kernel=fused: as hsn_t_memory_words_carry_bal_qk.yaml;
#   new: hardware.reader_compile=default, the opt-in key of PR #116 (docs/wcells_speed.md,
#     python/hsn/train/reader_compile.py): the carried reader's read of a training window runs as one torch.compile
#     graph (inductor's default mode, no CUDA graphs); evaluation keeps the eager reader. Equal to rounding, not bit
#     for bit. It compiles in about 27 s at the first step.
# The run's tree must build the window kernels with scripts/build_window_kernels.py (--arch 86 for the RTX 3060: the
# fatbin holds kernels/cuda/hsn_event.cu); without them the trainer raises at construction.
# model.word_contexts is per data set, a data line of the spec: code native [0,6,15], bio prose [0,6,10], code prose
# [0,6,11], chem native [0,6,13], phys native [0,6,14], chem prose and phys prose [0,6,10].
#
# Evidence (27k-window field runs of 22-26 Nov 2026: the local RTX 3060 alone, batch 32 x 256, seed 0; this file
# 9,000 steps x 3 windows, the others 27,000 steps x 1 window; dev bits per byte / next-byte accuracy % at the last
# step). The bar is memory-off HSN-T with the reader 160 x 8 at 27k steps. TXL-w is Transformer-XL widened to 3.43M
# (d 256, 4 blocks, 4 heads, MLP 1088); GDN-w is Gated DeltaNet widened to 3.41M (d 224, 4 blocks, 4 heads x 42).
# This file without the reader compile: specs fields_27k_wcells_word (code native, bio prose; tree 89835a4) and
# fields_27k_wcells_other_word (the other five; tree 0024951). The bar: fields_27k_cap (folder qknorm-runs, tree
# 9aeb660) and fields_27k_wcells_other_x8 (0024951). TXL-w: fields_27k_goal_txlw (0024951); GDN-w:
# fields_27k_goal_gdnw (3c85c2a).
#
#   | Set                  | This file      | GDN-w          | TXL-w          | Bar            |
#   |----------------------|----------------|----------------|----------------|----------------|
#   | Code native          | 0.9708 / 80.98 | 0.9491 / 80.93 | 0.9646 / 80.92 | 0.9941 / 80.52 |
#   | Bio prose            | 1.2436 / 74.17 | 1.2496 / 73.72 | 1.2414 / 74.12 | 1.2824 / 73.32 |
#   | Code prose           | 1.2389 / 75.52 | 1.1900 / 76.06 | 1.2247 / 75.70 | 1.2960 / 74.53 |
#   | Chem prose           | 1.2553 / 74.61 | 1.2273 / 74.78 | 1.2852 / 73.84 | 1.2714 / 74.28 |
#   | Phys prose           | 1.1889 / 75.22 | 1.1970 / 74.92 | 1.1929 / 75.00 | 1.2006 / 74.94 |
#   | Phys native          | 1.3534 / 73.22 | 1.3435 / 72.79 | 1.3425 / 73.11 | 1.3690 / 72.63 |
#   | Chem native (SMILES) | 0.8745 / 78.52 | 0.8416 / 79.28 | 0.8615 / 78.88 | 0.8622 / 78.85 |
#   | Mean                 | 1.1608 / 76.03 | 1.1426 / 76.07 | 1.1590 / 75.94 | 1.1822 / 75.58 |
#
#   Bits and accuracy rank differently on code native, bio prose and phys native: this file has the best accuracy
#     there, GDN-w (code native) and TXL-w (bio prose, phys native) the best bits.
#   ms a window alone (run medians): this file 54 to 61 (0.162 to 0.183 s a step of three windows); with
#     hardware.reader_compile 45.9 on code native (0.1378 s a step); GDN-w 60; TXL-w 19; the bar 29.
#   The compiled reader (spec fields_27k_wcells_rcomp, tree 115cbaf; code native, seed 0, one run each): 0.9711 /
#     80.99 against 0.9708 / 80.98 without it; first mentions 73.87 against 73.81, rare repeats 256-1023 bytes back
#     80.03 against 80.25, 1024+ bytes back 76.22 against 76.39. No difference is claimed either way.
#   Seed 1, this file against the bar (specs fields_27k_wcells_other_word_s1, fields_27k_wcells_other_x8_s1): phys
#     native 1.3605 / 73.18 against 1.3796 / 72.52, chem prose 1.2523 / 74.68 against 1.2684 / 74.35, phys prose
#     1.1933 / 75.13 against 1.1978 / 74.99, chem native 0.8736 / 78.56 against 0.8619 / 78.85.
#   Recall by distance (accuracy % on the same dev text, the first 6M bytes at most; this file / GDN-w / TXL-w / bar):
#
#   | Set         | Rare repeats 1024+ bytes back | First mentions            |
#   |-------------|-------------------------------|---------------------------|
#   | Code native | 76.4 / 71.8 / 70.0 / 69.7     | 73.8 / 75.3 / 75.0 / 74.9 |
#   | Bio prose   | 81.4 / 75.6 / 71.6 / 71.1     | 76.6 / 78.5 / 77.5 / 77.1 |
#   | Code prose  | 73.5 / 69.3 / 65.0 / 62.8     | 74.3 / 76.2 / 75.4 / 74.1 |
#   | Chem prose  | 68.0 / 59.7 / 56.8 / 57.0     | 73.5 / 76.7 / 75.3 / 75.5 |
#   | Phys prose  | 80.0 / 73.7 / 71.9 / 71.5     | 79.6 / 81.4 / 80.3 / 80.1 |
#   | Phys native | 64.7 / 55.5 / 54.0 / 53.8     | 72.6 / 74.5 / 73.9 / 73.8 |
#
#   Chem native is not in the recall table: its dev text holds 25 rare repeats 1024+ bytes back. Its first
#     mentions: 75.3 / 76.1 / 75.6 / 75.7.
# What it does: the best of the four on rare repeats 1024+ bytes back on all six scored sets, 4.2 to 9.2 points
#   over the next (GDN-w on each); better than the bar on six of the seven sets on seed 0 (not chem native) and on
#   three of the four on seed 1.
# What it does not:
#   GDN-w is better on the mean in bits, by 0.018 (1.1426 against 1.1608; accuracy 76.07 against 76.03), and on code
#     prose, chem prose and chem native in both measures, at about this file's step time.
#   TXL-w ties on the mean in bits (1.1590 against 1.1608) and runs 2.4 to 3.2 times as fast (19 ms a window
#     against 45.9 with the compiled reader on code native and 54 to 61 without).
#   Chem native (SMILES) is worse than the bar on both seeds (by 0.012 bits on each).
#   First mentions: the worst of the four on every set but code prose, where it is above the bar (74.3 against 74.1)
#     and under GDN-w and TXL-w.
# Open:
#   The loss on first mentions is under investigation (another agent, branch claude/first-mention).
#   One seed for the comparisons with TXL-w and GDN-w, whose learning rates are their 2M ones (TXL-w 1e-3, GDN-w
#     2e-3), not tuned at this size.
#   One accuracy run with the compiled reader (code native, seed 0); the other six sets ran without it.
#   Proteins (bio native) have no words, so no keyed cells. Runs longer than 27k windows are untested.
#
# Everything else is hsn_t_memory_words_carry_bal_qk.yaml's, and its header holds for this file: the reader, the
# QK norm, the carry, the word events, the balance loss and the data a spec sets. In an experiment spec the family is
# hsn_t. A CUDA arm:
#
#   base: {config: configs/experiments/hsn_t_memory_words_carry_bal_qk_write.yaml,
#          overrides: [profile=rtx3060, hardware.compile_mode=default, hardware.graph_alias_index=true,
#                      hardware.message_gradients=state, hardware.round_products=merged,
#                      hardware.event_kernel=fused, hardware.reader_compile=default]}
#
# Everything not listed keeps its Appendix A default (configs/_example.yaml).
# Do not edit a recipe once a spec uses it (its arm ids would change): a new recipe gets a new file.

run_id: hsn_t_memory_words_carry_bal_qk_write
seed: 0
notes: "HSN-T with its memory writing at word ends, the reader carried across windows, the paper's balance loss, the reader's unrotated top block with normalised queries and keys, and the keyed word cells written by the HSN with the gradient across three windows: hsn_t_memory_words_carry_bal_qk + model.word_cells=hash, model.word_cells_value=word, train.tbptt_windows=3, train.grad_accum=3."
profile: cpu # hardware profile: configs/hardware/<profile>.yaml; override with `profile=<name>`
model_name: hsn_t

model: # Appendix A.1
  vocab_size: 256 # byte vocabulary V
  d: 64 # width
  n_cells: 64 # N (hsn_recipe_a6: 32)
  n_units: 8 # M
  k_select: 12 # K cells per round (hsn_recipe_a6: 4)
  k_min: 1 # minimum selected cells
  r_max: 1 # internal rounds cap R
  in_degree: 4 # D_g
  random_edges: 0 # extra random candidate edges
  edge_norm: softmax # softmax | sigmoid
  hidden: 512 # H for every two-layer MLP
  n_context: 16 # context symbols
  context_dim: 64 # context embedding width (= d)
  activation: gelu # MLP activation (paper unspecified)
  init: trunc_normal_0.02 # weight init of embeddings, scorer, halting, decoder (paper unspecified)
  state_init: fan_in # P1.5a (amendment A1): E, P, S, units, V, W_out, gate weight; fan_in | trunc_normal_<std>
  cell_norm: rms # P1.5a: RMSNorm over the 4d cell input before the units and the gate; rms | none
  gate_bias_init: -3.0 # P1.5a: gate bias at init, sigmoid(-3) = 0.047 (cells retain by default)
  cand_norm: rms # P1.13 amendment A4: RMSNorm before the candidate's tanh
  key_address: true # amendment A5: fixed byte/cell address features (the key binding)
  selected_readout: true # amendment A5: the selected cells' mean appended to the decoder input
  address_ngram: 2 # amendment A9: addresses of the last two bytes
  address_history: ngram # A9's bytes carried across windows of a document (HSN-T requires it)
  address_gate: true # amendment A12: the scorer's address weights follow the position
  address_gate_input: summary # amendment A13: the gate reads the carried summary q_{t-1}
  scorer_position: wrap # amendment A11: the scorer's position feature is (pos mod unroll) / unroll
  scorer: linear # linear | mlp; Appendix C counts the linear scorer (200 -> 8)
  scorer_hidden: 128 # hidden width when scorer = mlp (the C.2 "two-layer scorer" row)
  scorer_features:
    exclude: [] # feature names to zero (ablation; e.g. [eps])
  routing: topk # learned top-K routing (dense | topk | greedy_budget | random | fixed)
  fixed_route: [] # cells for routing = fixed
  budget: 1.0 # B_t as a fraction of the dense step cost
  lambda_cost: 0.0 # lambda_cost in score = U - lambda * c
  deadline_ms: null # wall-clock deadline (serving)
  cost_profile: null # P2.1: cost profile (P0.6 report + cost_profile block) for the router's cost table; null = uniform placeholder
  static_k: true # pad selection to fixed K (needed for graphs / compile)
  age_max: 64 # refresh-probe threshold
  halt_threshold: 0.5 # inference halting threshold
  predictor_target: fixed_embedding # fixed_embedding | ema_encoder (P1.6)
  disabled_cells: [] # test hook
  ablate_shared_u: false # ablation: remove u from v (not covered by the P1.1 closed forms)
  reader: transformer # HSN-T: the reader in front of the memory core (4 heads; its width and blocks follow)
  reader_width: 160 # the top0 reader: 160 wide (hsn_t_memory_words.yaml: 64, the default)
  reader_layers: 4 # four blocks (hsn_t_memory_words.yaml: 2, the default)
  reader_rotary_pairs: [20, 20, 20, 0] # top0: the top block's queries and keys unrotated (hsn_t_memory_words.yaml: all rotated)
  reader_qk_norm: [false, false, false, true] # the top (unrotated) block's queries and keys normalised per head (hsn_t_memory_words_carry_bal.yaml: false)
  reader_span: null # no span (the carry refuses one: it is the reader's span) (hsn_t_memory_words.yaml: 32)
  reader_carry: 256 # every block reads up to 256 positions back in its document, across windows (hsn_t_memory_words.yaml: 0)
  cell_attention_heads: 0 # C-read off (as hsn_t_memory_words.yaml); with the carry it was measured once (header)
  write_events: word # the memory runs at word ends and document starts (as hsn_t_memory_words.yaml)
  word_address: exact # an event's address is the whole word it closes (as hsn_t_memory_words.yaml)
  word_contexts: [0, 6] # TinyStories' text and its padding (as hsn_t_memory_words.yaml; code default [6]); specs add theirs
  word_cells: hash # the keyed word cells beside the routed cells (docs/amendments/word_cells.md; hsn_t_memory_words_carry_bal_qk.yaml: off)
  word_cells_value: word # their write is the HSN's: the routed cells' units, gate, W_out, V and scorer (hsn_t_memory_words_carry_bal_qk.yaml: bytes)
  state_schema_version: 1 # bumped on any state layout change

data:
  dataset: synthetic_v1
  manifest: data/synthetic_v1/manifest.json # built by `python -m hsn.data.synthetic build`
  tasks: [delayed] # hsn_recipe_a6's task; a spec sets its own data
  variants: [in_range] # the designated in-range state tasks
  align_docs: true # every document starts at a window boundary (in_range = fits one window)

train: # hsn_t_memory_words_carry.yaml's, with the balance loss on (lambda_b, aux_enabled) and three windows a gradient segment
  unroll: 256 # TBPTT window T
  batch: 32
  micro_batch: 32
  grad_accum: 3 # three windows an optimiser step (hsn_t_memory_words_carry_bal_qk.yaml: 1)
  tbptt_windows: 3 # one gradient segment of the three: the later windows' reads train the keyed write (hsn_t_memory_words_carry_bal_qk.yaml: 1)
  precision: bf16 # bf16 | fp16 | fp32 | fp64
  optimizer: lazy_adamw # P2.6: the routed HSN's optimiser
  lr: 1.25e-3 # the user's decision of 17 Nov 2026 for word events (as hsn_t_memory_words.yaml)
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps: 200
  schedule: wsd # warmup-stable-decay (P1.13): the peak holds until the last 20 %
  decay_fraction: 0.2
  grad_clip: 1.0
  grad_norm_precision: float64 # A5: the global gradient norm and its clip reduced in float64
  steps: 9000
  eval_every: 500
  ckpt_every: 9000
  stats_every: 100
  q_resync_every: 64
  lambda_p: 1.0 # L_pred with the fixed-embedding target (P1.6)
  lambda_b: 0.02 # the balance loss's weight, the user's decision of 21 Nov 2026 (hsn_t_memory_words_carry.yaml: 0.0)
  aux_enabled: [balance] # the paper's balance loss on (Appendix A.3; hsn_t_memory_words_carry.yaml: [])
  search_trials: 4 # as hsn_recipe_a6 (unused by the harness)
  probe_horizon: null # the probes read to the window end
  # unguarded: no spike guard and no rollback
  spike_factor: null
  rollback_every: null
  # amendment A6's cut without `state` ("cut C", the state gradient): the summary, eps and router reads are
  # constants in the backward pass, the cell's read of the state keeps its gradient (hsn_recipe_a6 cuts all four)
  feedback_detach: [summary, eps, router]
  # the update caps of exp 346 (hsn_recipe_a6's)
  update_limit:
    groups:
      memory: {selectors: ["cell.*"], max_ratio: 0.003}
      routing: {selectors: ["router.*"], max_ratio: 0.003}
    norm_floor: 1.0e-12
    norm_growth_limits: {routing: 1.0}
  # A6: evaluations, probes and the final checkpoint score a moving average of the weights (decay 0.99)
  weight_ema: 0.99
  # A6: the route guard (its other keys at their defaults: configs/_example.yaml)
  route_guard:
    enabled: true
  # amendment A7 (on in hsn_t_memory.yaml by the user's decision of 16 Nov 2026; code default softmax): the
  # straight-through unit weight of an executed slot differentiates the executed unit's score alone
  unit_credit: executed
  # P2.2 routing controls: the straight-through gate, no soft warm-up, the others at their defaults
  gate_mode: ste
  soft_until_step: 0
  temperature_start: 1.0
  temperature_end: 1.0
  temperature_steps: 0
  epsilon_start: 0.0
  epsilon_end: 0.0
  epsilon_steps: 0
  p_dense: 0.0
  reinforce_baseline_decay: 0.9
