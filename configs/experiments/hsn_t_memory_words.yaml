# hsn_t_memory_words: the recipe for HSN-T with its memory writing at word ends (the user's decision of 17 Nov 2026).
#
# The user's decision of 17 Nov 2026: learning rate 1.25e-3 for HSN-T runs with word events
# (model.write_events=word), and only for those; the per-byte memory keeps 2.5e-3 (hsn_t_memory.yaml, unchanged).
# This file is hsn_t_memory.yaml (main's HSN-T memory form) with four keys changed, written out:
#   model.write_events word (docs/amendments/write_events.md: the memory runs at word ends and document starts,
#   the decoder still reads every byte); model.word_address exact (an event's address is the whole word it
#   closes, the product of fixed ±1 tables per byte position: "The word address" there); model.word_contexts
#   [0, 6] (below); train.lr 1.25e-3 (hsn_t_memory.yaml: 2.5e-3).
# It resolves to hsn_t_memory.yaml with those overrides exactly (the same arm ids, and the same configuration hash
# once run_id and notes are aligned: tests/test_hsn_t_memory_words_recipe.py; with the top0 reader alone on top, a
# spec on it expands to the arm ids of the TinyStories runs at 1.25e-3). The word address adds buffers, no
# parameters: 2,037,801 trainable, as hsn_t_memory.yaml.
#
# Evidence (HSN-T memory in main's form, runs of 16-17 Nov 2026, dev numbers at the last step):
#   Word-delayed recall (synthetic_wordhold, tasks kvw and delayedw; 18,000 steps, 32-byte reader, exact address):
#     lr 2.5e-3 collapsed late on both seeds: s0 68.90 %, s1 66.05 % (peaks 99.4-99.6 %; the training loss rose
#     from about step 14,400-16,000, gradient-norm spikes 125-431); the bag address (s0) sagged to 82.33 %.
#     lr 1.25e-3: s0 99.65 %, s1 99.37 %, s2 99.80 %, bag address s0 99.65 %; all stable (gradient norms at most 31,
#     except one early 129 on bag) and all pass the 97 % recall rule.
#     The per-byte memory on the same task: 94.47 % (2.5e-3), 93.40 % (1.25e-3), seed 0.
#   TinyStories, 9,000 steps, word events with the top0 reader, dev bits per byte (lower is better):
#     lr 1.25e-3 0.8842 / 0.8808 (s0 / s1) against 2.5e-3 0.8939 / 0.8960; 6.25e-4 0.8991 and 5e-3 0.9180 (s0).
#   TinyStories, 27,000 steps, top0 reader, seed 0: word events 0.7972 (1.25e-3) against 0.8043 (2.5e-3); the
#     per-byte memory 0.7792 (1.25e-3) against 0.7783 (2.5e-3): it gains nothing from the lower rate and keeps
#     hsn_t_memory.yaml.
#   Word keys (synthetic_wordkeys, 18,000 steps, 32-byte reader, exact address) at 2.5e-3: no late collapse on two
#     seeds, 99.54 / 99.83 % (s0 / s1; s0 had one gradient-norm spike of 313 at step 14,339, dev 99.1-99.5 % from
#     10,500 on). Runs at 1.25e-3 were started on 17 Nov 2026 and are not in.
#
# model.word_contexts (the context ids whose bytes the word address reads as text) is [0, 6] here because every
# word-event run above used it: every TinyStories run (context 6 is the stories, context 0 the padding behind every
# document under data.align_docs: read as text, the padding makes no events), and the task specs used supersets of
# it (word keys [0, 6, 7], word-delayed [0, 6, 7, 8]). A spec adds its task's contexts on top. The code default
# [6] would make every padding byte of TinyStories an event (about 3.7 times the byte address's slots per window:
# docs/amendments/write_events.md, "The compiled window and the padding"). On this file's data block (the delayed
# task, contexts 1 to 5) the task's bytes are under no text context: each is its own word and an event.
#
# The reader is hsn_t_memory's main form (reader_span 32). A spec may change it; the top0 reader of the TinyStories
# runs above is, on this file (whose span must be cleared for the whole window):
#   model.reader_width=160 model.reader_layers=4 model.reader_rotary_pairs=[20,20,20,0] model.reader_span=null
# The attention read of the cells stays off, as in hsn_t_memory.yaml (with word events and the top0 reader,
# model.cell_attention_heads=4 gave 0.8938 against 0.8939 on TinyStories 9k, s0, lr 2.5e-3).
# hardware.graph_alias_index=true stays an override (a `hardware` block in a configuration replaces the whole
# profile), and a spec sets its own data (TinyStories: data.dataset, data.manifest, data.tasks, data.variants).
# In an experiment spec the family is hsn_t. A CUDA arm:
#
#   base: {config: configs/experiments/hsn_t_memory_words.yaml,
#          overrides: [profile=rtx3060, hardware.compile_mode=reduce-overhead, hardware.graph_alias_index=true]}
#
# Everything not listed keeps its Appendix A default (configs/_example.yaml).
# Do not edit a recipe once a spec uses it (its arm ids would change): a new recipe gets a new file.

run_id: hsn_t_memory_words
seed: 0
notes: "HSN-T with its memory writing at word ends: hsn_t_memory (main's form) + word events, the exact word address over contexts [0, 6] and lr 1.25e-3."
profile: cpu # hardware profile: configs/hardware/<profile>.yaml; override with `profile=<name>`
model_name: hsn_t

model: # Appendix A.1
  vocab_size: 256 # byte vocabulary V
  d: 64 # width
  n_cells: 64 # N (hsn_recipe_a6: 32)
  n_units: 8 # M
  k_select: 12 # K cells per round (hsn_recipe_a6: 4)
  k_min: 1 # minimum selected cells
  r_max: 1 # internal rounds cap R
  in_degree: 4 # D_g
  random_edges: 0 # extra random candidate edges
  edge_norm: softmax # softmax | sigmoid
  hidden: 512 # H for every two-layer MLP
  n_context: 16 # context symbols
  context_dim: 64 # context embedding width (= d)
  activation: gelu # MLP activation (paper unspecified)
  init: trunc_normal_0.02 # weight init of embeddings, scorer, halting, decoder (paper unspecified)
  state_init: fan_in # P1.5a (amendment A1): E, P, S, units, V, W_out, gate weight; fan_in | trunc_normal_<std>
  cell_norm: rms # P1.5a: RMSNorm over the 4d cell input before the units and the gate; rms | none
  gate_bias_init: -3.0 # P1.5a: gate bias at init, sigmoid(-3) = 0.047 (cells retain by default)
  cand_norm: rms # P1.13 amendment A4: RMSNorm before the candidate's tanh
  key_address: true # amendment A5: fixed byte/cell address features (the key binding)
  selected_readout: true # amendment A5: the selected cells' mean appended to the decoder input
  address_ngram: 2 # amendment A9: addresses of the last two bytes
  address_history: ngram # A9's bytes carried across windows of a document (HSN-T requires it)
  address_gate: true # amendment A12: the scorer's address weights follow the position
  address_gate_input: summary # amendment A13: the gate reads the carried summary q_{t-1}
  scorer_position: wrap # amendment A11: the scorer's position feature is (pos mod unroll) / unroll
  scorer: linear # linear | mlp; Appendix C counts the linear scorer (200 -> 8)
  scorer_hidden: 128 # hidden width when scorer = mlp (the C.2 "two-layer scorer" row)
  scorer_features:
    exclude: [] # feature names to zero (ablation; e.g. [eps])
  routing: topk # learned top-K routing (dense | topk | greedy_budget | random | fixed)
  fixed_route: [] # cells for routing = fixed
  budget: 1.0 # B_t as a fraction of the dense step cost
  lambda_cost: 0.0 # lambda_cost in score = U - lambda * c
  deadline_ms: null # wall-clock deadline (serving)
  cost_profile: null # P2.1: cost profile (P0.6 report + cost_profile block) for the router's cost table; null = uniform placeholder
  static_k: true # pad selection to fixed K (needed for graphs / compile)
  age_max: 64 # refresh-probe threshold
  halt_threshold: 0.5 # inference halting threshold
  predictor_target: fixed_embedding # fixed_embedding | ema_encoder (P1.6)
  disabled_cells: [] # test hook
  ablate_shared_u: false # ablation: remove u from v (not covered by the P1.1 closed forms)
  reader: transformer # HSN-T: the reader in front of the memory core (width 64, 2 blocks, 4 heads by default)
  reader_span: 32 # the reader attends over the last 32 bytes only; a distant fact is the memory's
  cell_attention_heads: 0 # C-read off (as hsn_t_memory.yaml); text arms may set 4
  write_events: word # the memory runs at word ends and document starts (hsn_t_memory.yaml: byte)
  word_address: exact # an event's address is the whole word it closes (hsn_t_memory.yaml: none)
  word_contexts: [0, 6] # TinyStories' text and its padding, as every run above (code default [6]); specs add theirs
  state_schema_version: 1 # bumped on any state layout change

data:
  dataset: synthetic_v1
  manifest: data/synthetic_v1/manifest.json # built by `python -m hsn.data.synthetic build`
  tasks: [delayed] # hsn_recipe_a6's task; a spec sets its own data
  variants: [in_range] # the designated in-range state tasks
  align_docs: true # every document starts at a window boundary (in_range = fits one window)

train: # hsn_t_memory.yaml's, with lr changed
  unroll: 256 # TBPTT window T
  batch: 32
  micro_batch: 32
  grad_accum: 1
  precision: bf16 # bf16 | fp16 | fp32 | fp64
  optimizer: lazy_adamw # P2.6: the routed HSN's optimiser
  lr: 1.25e-3 # the user's decision of 17 Nov 2026 for word events (hsn_t_memory.yaml: 2.5e-3)
  betas: [0.9, 0.95]
  weight_decay: 0.01
  warmup_steps: 200
  schedule: wsd # warmup-stable-decay (P1.13): the peak holds until the last 20 %
  decay_fraction: 0.2
  grad_clip: 1.0
  grad_norm_precision: float64 # A5: the global gradient norm and its clip reduced in float64
  steps: 9000
  eval_every: 500
  ckpt_every: 9000
  stats_every: 100
  q_resync_every: 64
  lambda_p: 1.0 # L_pred with the fixed-embedding target (P1.6)
  search_trials: 4 # as hsn_recipe_a6 (unused by the harness)
  probe_horizon: null # the probes read to the window end
  # unguarded: no spike guard and no rollback
  spike_factor: null
  rollback_every: null
  # amendment A6's cut without `state` ("cut C", the state gradient): the summary, eps and router reads are
  # constants in the backward pass, the cell's read of the state keeps its gradient (hsn_recipe_a6 cuts all four)
  feedback_detach: [summary, eps, router]
  # the update caps of exp 346 (hsn_recipe_a6's)
  update_limit:
    groups:
      memory: {selectors: ["cell.*"], max_ratio: 0.003}
      routing: {selectors: ["router.*"], max_ratio: 0.003}
    norm_floor: 1.0e-12
    norm_growth_limits: {routing: 1.0}
  # A6: evaluations, probes and the final checkpoint score a moving average of the weights (decay 0.99)
  weight_ema: 0.99
  # A6: the route guard (its other keys at their defaults: configs/_example.yaml)
  route_guard:
    enabled: true
  # amendment A7 (on in hsn_t_memory.yaml by the user's decision of 16 Nov 2026; code default softmax): the
  # straight-through unit weight of an executed slot differentiates the executed unit's score alone
  unit_credit: executed
  # P2.2 routing controls: the straight-through gate, no soft warm-up, the others at their defaults
  gate_mode: ste
  soft_until_step: 0
  temperature_start: 1.0
  temperature_end: 1.0
  temperature_steps: 0
  epsilon_start: 0.0
  epsilon_end: 0.0
  epsilon_steps: 0
  p_dense: 0.0
  reinforce_baseline_decay: 0.9
