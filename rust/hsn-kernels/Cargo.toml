[package]
name = "hsn-kernels"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "HSN kernel backends: Backend trait, CPU oracle, CUDA/Metal hosts for the compiled binaries"

[features]
default = ["cpu"]
cpu = []
cuda = ["dep:cudarc"] # stays off by default; driver loading only, no runtime compiler
metal = [] # empty until P2.11; must stay off by default

[dependencies]
hsn-core.workspace = true
serde_json.workspace = true
thiserror.workspace = true
cudarc = { version = "=0.19.10", optional = true, default-features = false, features = ["std", "driver", "dynamic-loading", "cuda-13000"] }

[dev-dependencies]
half = "2.7.1"
